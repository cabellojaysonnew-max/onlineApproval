<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DAR CS I - Unified Command Portal</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#003811">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --dar-green: #003811; --dar-gold: #D4AF37; --dar-light: #006400; --danger: #dc2626; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .bg-dar { background-color: var(--dar-green); } .text-dar { color: var(--dar-green); } .bg-gold { background-color: var(--dar-gold); }
        .btn-primary { background-color: var(--dar-green); color: white; border-radius: 0.75rem; font-weight: bold; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-gold { background: var(--dar-gold); color: var(--dar-green); border-radius: 0.75rem; font-weight: bold; text-transform: uppercase; }
        ::-webkit-scrollbar { display: none; }
        .modal-fade { animation: fadeIn 0.2s ease-in-out; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .search-results-box { position: absolute; width: 100%; max-height: 200px; overflow-y: auto; z-index: 2000; background: white; border: 2px solid var(--dar-gold); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); top: 100%; left: 0; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Specific components from sub-systems */
        .cal-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .cal-table td { padding: 8px; border-bottom: 1px solid #eee; vertical-align: top; }
        .cal-entry { margin-bottom: 4px; padding: 4px; border-radius: 4px; color: white; font-weight: bold; font-size: 10px; }
        .entry-to { background: var(--dar-green); } .entry-pso { background: var(--dar-gold); color: #003811; } .entry-holiday { background: var(--danger); }
        .qr-maximized { position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; width: 85vw !important; height: 85vw !important; z-index: 9999 !important; box-shadow: 0 0 0 2000px rgba(0,0,0,0.85) !important; background: white !important; border: 4px solid var(--dar-gold) !important; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden text-gray-800 relative">

    <div id="master-landing" class="h-full w-full flex flex-col justify-center items-center bg-[#f4f7f6] p-6 z-[100] absolute inset-0">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border-t-8 border-[#D4AF37] text-center">
            <h1 class="text-4xl font-black text-[#003811] mb-1">DAR</h1>
            <p class="text-[10px] text-gray-500 mb-8 font-bold tracking-widest uppercase">Camarines Sur I - Unified Portal</p>
            <button onclick="showPortal('employee')" class="w-full mb-4 py-4 bg-[#003811] text-white rounded-xl font-bold text-lg shadow-md transition active:scale-95">👤 EMPLOYEE PORTAL</button>
            <button onclick="showPortal('console')" class="w-full py-4 bg-[#D4AF37] text-[#003811] rounded-xl font-bold text-lg shadow-md transition active:scale-95">⚙️ SYSTEM CONSOLE</button>
        </div>
    </div>

    <div id="login-container" class="hidden h-full w-full flex flex-col justify-center items-center px-6 bg-dar z-[90] absolute inset-0">
        <button onclick="backToMaster()" class="absolute top-10 left-6 text-white font-bold text-sm">← Back</button>
        <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gold h-2 w-full"></div>
            <div class="p-8" id="login-form-content">
                </div>
        </div>
    </div>

    <div id="app" class="hidden w-full h-full flex flex-col relative overflow-hidden">
        </div>

    <div id="modal-layer" class="z-[200]"></div>
    <div id="print-table-section" class="hidden w-full bg-white z-[9999] absolute inset-0"></div>

    <script>
        const SB_URL = "https://ytfpiyfapvybihlngxks.supabase.co";
        const SB_KEY = "sb_publishable_poSZUQ9HI4wcY9poEo5b1w_Z-pAJbKo"; 
        const db = window.supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null; // Can be Employee data or User data
        let userRole = null; // 'EMPLOYEE', 'ACCOUNTANT', 'VEHICLE_APPROVER', 'ADMIN', 'CHIEF', 'PARPO'
        let currentSystem = null; // 'accounting', 'fleet', 'employee', 'admin'
        
        // --- GLOBAL NAVIGATION ---
        function showPortal(type) {
            document.getElementById('master-landing').classList.add('hidden');
            document.getElementById('login-container').classList.remove('hidden');
            const loginBox = document.getElementById('login-form-content');
            
            if (type === 'employee') {
                loginBox.innerHTML = `
                    <h2 class="text-dar font-black text-2xl text-center mb-1">EMPLOYEE LOGIN</h2>
                    <p class="text-[10px] text-gray-400 font-bold tracking-widest mb-6 uppercase text-center">Camarines Sur I</p>
                    <div class="space-y-4">
                        <input type="text" id="log-id" placeholder="Employee ID Number" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-dar">
                        <input type="password" id="log-pass" placeholder="Portal Password" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-dar">
                        <button onclick="handleLogin('EMPLOYEE')" class="w-full mt-2 btn-primary py-3.5">Enter Portal</button>
                    </div>`;
            } else {
                loginBox.innerHTML = `
                    <h2 class="text-dar font-black text-2xl text-center mb-1">SYSTEM CONSOLE</h2>
                    <p class="text-[10px] text-gray-400 font-bold tracking-widest mb-6 uppercase text-center">Official Access</p>
                    <div class="space-y-4">
                        <input type="text" id="log-id" placeholder="Username" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-dar">
                        <input type="password" id="log-pass" placeholder="Password" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-dar">
                        <button onclick="handleLogin('CONSOLE')" class="w-full mt-2 btn-primary py-3.5">Identify & Enter</button>
                    </div>`;
            }
        }

        function backToMaster() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('master-landing').classList.remove('hidden');
        }

        async function handleLogin(portalType) {
            const id = document.getElementById('log-id').value.trim();
            const pass = document.getElementById('log-pass').value.trim();

            if (portalType === 'EMPLOYEE') {
                const { data } = await db.from('employees').select('*').eq('emp_id', id).single();
                if (data && data.pass === pass) {
                    currentUser = data; userRole = 'EMPLOYEE'; currentSystem = 'employee';
                    launchSystem();
                } else alert("Invalid Employee Credentials");
            } else {
                const { data } = await db.from('users').select('*').eq('username', id).eq('password', pass).single();
                if (data) {
                    currentUser = data; userRole = data.role.toUpperCase();
                    if (userRole === 'ACCOUNTANT') currentSystem = 'accounting';
                    else if (userRole === 'VEHICLE_APPROVER') currentSystem = 'fleet';
                    else currentSystem = 'admin';
                    launchSystem();
                } else alert("Invalid Console Credentials");
            }
        }

        function launchSystem() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            if (currentSystem === 'employee') initEmployeePortal();
            else if (currentSystem === 'accounting') initAccountingVerifier();
            else if (currentSystem === 'fleet') initFleetMaster();
            else initAdminConsole();
        }

        function logout() { location.reload(); }

        // ==========================================
        // SYSTEM 1: ACCOUNTING VERIFIER (Intelligent Overlap Audit)
        // ==========================================
        let accEmps = [], accSelected = null;
        function initAccountingVerifier() {
            renderAccHeader();
            renderAccHome();
            loadAccEmps();
        }
        function renderAccHeader() {
            document.getElementById('app').innerHTML = `
            <header class="flex-none w-full h-16 bg-dar text-white px-5 flex justify-between items-center shadow-md z-50">
                <div class="text-left"><h1 class="font-bold text-lg">Accounting Audit</h1><p class="text-[10px] text-dar-gold font-bold uppercase">${currentUser.full_name}</p></div>
                <div class="flex gap-2">
                    <button onclick="showChangePwd()" class="text-[10px] bg-white/20 px-3 py-1.5 rounded-full font-bold uppercase">Pass</button>
                    <button onclick="logout()" class="text-[10px] bg-white/20 px-3 py-1.5 rounded-full font-bold uppercase">Logout</button>
                </div>
            </header>
            <main id="acc-content" class="flex-grow w-full overflow-y-auto p-4 md:p-8 pb-32"></main>`;
        }
        async function loadAccEmps() { const {data} = await db.from('employees').select('*'); accEmps = data || []; }
        function renderAccHome() {
            document.getElementById('acc-content').innerHTML = `
            <div class="max-w-2xl mx-auto space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="space-y-4">
                        <div class="relative">
                            <label class="text-[10px] font-black text-dar uppercase mb-1 block">Employee Search</label>
                            <input id="accSearch" oninput="runAccSearch(this)" placeholder="Search name..." class="w-full p-3 border rounded-xl text-sm outline-none bg-slate-50 uppercase font-bold">
                            <div id="accResults" class="search-results-box hidden"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-[10px] font-black text-dar uppercase mb-1 block">From</label><input id="accD1" type="date" class="w-full p-3 border rounded-xl text-sm bg-slate-50"></div>
                            <div><label class="text-[10px] font-black text-dar uppercase mb-1 block">To</label><input id="accD2" type="date" class="w-full p-3 border rounded-xl text-sm bg-slate-50"></div>
                        </div>
                        <button onclick="runAccAudit()" class="w-full btn-primary text-xs py-4 tracking-widest">🔍 Start Intelligence Audit</button>
                    </div>
                </div>
                <div id="accResultsArea" class="hidden space-y-4"></div>
            </div>`;
        }
        function runAccSearch(inp) {
            const div = document.getElementById('accResults');
            const val = inp.value.toLowerCase().trim();
            if (val.length < 2) { div.classList.add('hidden'); return; }
            const match = accEmps.filter(e => e.full_name.toLowerCase().includes(val)).slice(0, 5);
            div.innerHTML = match.map(e => `<div onclick="pickAccEmp('${e.full_name.replace(/'/g,"")}', '${e.emp_id}')" class="p-4 border-b text-[11px] font-black cursor-pointer uppercase hover:bg-slate-50">${e.full_name}</div>`).join('');
            div.classList.remove('hidden');
        }
        function pickAccEmp(n, id) { 
            document.getElementById('accSearch').value = n; 
            document.getElementById('accResults').classList.add('hidden'); 
            accSelected = { n, id }; 
        }
        async function runAccAudit() {
            if(!accSelected) return alert("Select Employee");
            const d1 = document.getElementById('accD1').value, d2 = document.getElementById('accD2').value;
            if(!d1 || !d2) return alert("Select Dates");
            const area = document.getElementById('accResultsArea');
            area.innerHTML = `<p class="text-center p-10 font-bold animate-pulse text-slate-400 uppercase text-xs">Analyzing Specific Day Activities...</p>`;
            area.classList.remove('hidden');
            
            const [itins, hols, bookings, psos, leaves, orders, ctos] = await Promise.all([
                db.from('itinerary').select('*').gte('travel_date', d1).lte('travel_date', d2),
                db.from('holidays').select('*').gte('date', d1).lte('date', d2),
                db.from('fleet_bookings').select('*').eq('emp_id', accSelected.id).gte('travel_date', d1).lte('travel_date', d2),
                db.from('pso_records').select('*').eq('emp_id', accSelected.id).lte('start_date', d2).gte('end_date', d1),
                db.from('leave_ledger').select('*').eq('emp_id', accSelected.id).eq('transaction_type', 'APPROVED').lte('start_date', d2).gte('end_date', d1),
                db.from('travel_orders').select('*').eq('emp_id', accSelected.id).eq('status', 'APPROVED'),
                db.from('cto_records').select('*').eq('emp_id', accSelected.id).gte('leave_date', d1).lte('leave_date', d2)
            ]);

            const dates = []; let curr = new Date(d1); const end = new Date(d2);
            while(curr <= end) { dates.push(curr.toISOString().split('T')[0]); curr.setDate(curr.getDate()+1); }

            let html = '';
            dates.forEach(date => {
                const active = [];
                hols.data.filter(h => h.date === date).forEach(h => active.push({type:'holiday', title:`📍 HOLIDAY`, sub:h.name, bg:'bg-red-50', txt:'text-red-700'}));
                ctos.data.filter(c => c.leave_date === date).forEach(c => active.push({type:'cto', title:`⏳ CTO`, sub:c.purpose, bg:'bg-teal-50', txt:'text-teal-700'}));
                leaves.data.filter(l => date >= l.start_date && date <= l.end_date).forEach(l => active.push({type:'leave', title:`🏖️ LEAVE: ${l.type}`, sub:l.remarks, bg:'bg-purple-50', txt:'text-purple-700'}));
                bookings.data.filter(b => b.travel_date === date).forEach(b => active.push({type:'fleet', title:`🚗 FLEET: ${b.vehicle}`, sub:b.destination, bg:'bg-amber-50', txt:'text-amber-700'}));
                psos.data.filter(p => date >= p.start_date && date <= p.end_date).forEach(p => active.push({type:'pso', title:`ℹ️ PSO: ${p.pso_no}`, sub:p.subject, bg:'bg-blue-50', txt:'text-blue-700'}));
                const dayI = itins.data.filter(i => i.travel_date === date);
                orders.data.filter(to => dayI.some(i => i.to_no === to.to_no)).forEach(t => active.push({type:'to', title:`📄 TO: ${t.to_no}`, sub:dayI.find(i=>i.to_no===t.to_no).destination, bg:'bg-green-50', txt:'text-dar'}));

                if(active.length > 0) {
                    const conflict = active.length > 1;
                    html += `<div class="bg-white rounded-2xl border p-5 shadow-sm ${conflict ? 'border-red-500' : 'border-slate-200'} relative">
                        <div class="flex justify-between mb-3">
                            <h4 class="text-sm font-black">${date}</h4>
                            ${conflict ? '<span class="bg-red-600 text-white text-[8px] px-2 py-1 rounded font-black animate-pulse">⚠️ CONFLICT</span>' : ''}
                        </div>
                        <div class="space-y-2">${active.map(a => `<div class="p-3 rounded-xl border ${a.bg}"><h5 class="text-[9px] font-black uppercase ${a.txt}">${a.title}</h5><p class="text-[10px] italic">${a.sub}</p></div>`).join('')}</div>
                    </div>`;
                }
            });
            area.innerHTML = html || `<p class="text-center p-10 font-bold text-slate-300 uppercase">No Activity Recorded</p>`;
        }

        // ==========================================
        // SYSTEM 2: FLEET MASTER PRO (Dispatch & Transfer)
        // ==========================================
        const VEHICLES = ["MAZDA", "REVO", "INNOVA", "SKY", "BLACK"];
        let fleetOrders = [], fleetItins = [], fleetBookings = [], fleetTab = 'inbox';
        
        function initFleetMaster() {
            renderFleetUI();
            syncFleet();
        }
        function renderFleetUI() {
            document.getElementById('app').innerHTML = `
            <header class="flex-none w-full h-16 bg-dar text-white px-5 flex justify-between items-center shadow-md no-print">
                <div class="text-left"><h1 class="font-bold text-lg">Dispatch Command</h1><p class="text-[10px] text-dar-gold font-bold uppercase">${currentUser.full_name}</p></div>
                <div class="flex gap-2"><button onclick="syncFleet()" class="text-lg">🔄</button><button onclick="logout()" class="text-xs font-bold bg-white/20 px-3 py-1.5 rounded-full">Logout</button></div>
            </header>
            <main id="fleet-content" class="flex-grow w-full overflow-y-auto p-4 pb-32"></main>
            <nav class="flex-none w-full h-16 bg-white border-t flex z-50 pb-safe shadow no-print">
                <button onclick="switchFleetTab('inbox')" class="flex-1 flex flex-col items-center justify-center text-[10px] uppercase font-bold text-gray-400" id="ftab-inbox">📥 Inbox</button>
                <button onclick="switchFleetTab('res')" class="flex-1 flex flex-col items-center justify-center text-[10px] uppercase font-bold text-gray-400" id="ftab-res">📋 List</button>
                <button onclick="switchFleetTab('sched')" class="flex-1 flex flex-col items-center justify-center text-[10px] uppercase font-bold text-gray-400" id="ftab-sched">📅 Schedule</button>
            </nav>
            <div class="fixed bottom-20 right-4 no-print"><button onclick="openFleetModal()" class="bg-dar text-white border-2 border-dar-gold p-4 rounded-full font-black text-[10px] shadow-2xl">+ BOOKING</button></div>`;
        }
        async function syncFleet() {
            const [o, i, b] = await Promise.all([db.from('travel_orders').select('*').neq('status','CANCELLED'), db.from('itinerary').select('*'), db.from('fleet_bookings').select('*')]);
            fleetOrders = o.data; fleetItins = i.data; fleetBookings = b.data;
            updateFleetView();
        }
        function switchFleetTab(t) { fleetTab = t; updateFleetView(); }
        function updateFleetView() {
            const m = document.getElementById('fleet-content');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('text-dar'));
            document.getElementById(`ftab-${fleetTab}`).classList.add('text-dar');
            
            if(fleetTab === 'inbox') renderFleetInbox(m);
            else if(fleetTab === 'res') renderFleetReservations(m);
            else renderFleetSchedule(m);
        }
        function renderFleetInbox(m) {
            const pending = fleetOrders.filter(x => x.status === 'PENDING_VEHICLE_APPROVER');
            if(!pending.length) { m.innerHTML = `<p class="text-center p-20 text-slate-300 font-bold uppercase text-xs">Inbox Clear</p>`; return; }
            m.innerHTML = `<div class="space-y-4">` + pending.map(o => `
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <span class="text-[9px] font-black text-dar">TO: ${o.to_no}</span>
                    <h3 class="font-black text-sm uppercase">${o.emp_name}</h3>
                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <select id="v-${o.to_no}" class="border rounded p-2 text-[10px] font-bold"><option disabled selected>Vehicle</option>${VEHICLES.map(v=>`<option>${v}</option>`).join('')}</select>
                        <select id="s-${o.to_no}" class="border rounded p-2 text-[10px] font-bold"><option>WHOLE DAY</option><option>AM</option><option>PM</option></select>
                    </div>
                    <button onclick="approveFleetTrip('${o.to_no}', '${o.unit}')" class="w-full btn-primary py-2.5 mt-3 text-[10px]">Approve Request</button>
                </div>`).join('') + `</div>`;
        }
        async function approveFleetTrip(to, unit) {
            const v = document.getElementById(`v-${to}`).value;
            if(v === 'Vehicle') return alert("Select Vehicle");
            const route = (unit === "PARPO") ? "PENDING_PARPO" : (unit ? "PENDING_UNIT_HEAD" : "PENDING_CHIEF");
            await db.from('travel_orders').update({ received: v, status: route, remarks: document.getElementById(`s-${to}`).value }).eq('to_no', to);
            syncFleet();
        }

        // ==========================================
        // SYSTEM 3: EMPLOYEE PORTAL (Drafting & Status)
        // ==========================================
        let empItin = [], empPass = [];
        function initEmployeePortal() {
            empPass = [{ emp_id: currentUser.emp_id, name: currentUser.full_name, unit: currentUser.unit }];
            renderEmpUI();
        }
        function renderEmpUI() {
            document.getElementById('app').innerHTML = `
            <header class="app-header h-16 px-5 border-b-2 border-dar-gold flex items-center justify-between bg-dar text-white">
                <div><div class="font-bold text-sm leading-none">${currentUser.full_name}</div><div class="text-[9px] font-bold text-dar-gold uppercase">${currentUser.division} | ${currentUser.position}</div></div>
                <button onclick="logout()" class="text-[10px] font-bold border border-white px-3 py-1 rounded">Logout</button>
            </header>
            <main id="emp-content" class="flex-grow overflow-y-auto p-4 pb-32"></main>
            <nav class="flex-none h-16 bg-dar flex items-center">
                <div onclick="renderEmpApply()" class="flex-1 text-center text-[9px] font-bold text-white uppercase">📝 Apply</div>
                <div onclick="renderEmpStatus()" class="flex-1 text-center text-[9px] font-bold text-white uppercase">📋 Status</div>
                <div onclick="renderEmpCalendar()" class="flex-1 text-center text-[9px] font-bold text-white uppercase">📅 Schedule</div>
            </nav>`;
            renderEmpApply();
        }
        function renderEmpApply() {
            document.getElementById('emp-content').innerHTML = `
            <div class="space-y-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200">
                    <h4 class="text-[11px] font-black uppercase text-dar mb-3 border-b pb-1">1. Build Itinerary</h4>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <input id="empD1" type="date" class="p-3 border rounded-xl text-sm" onchange="document.getElementById('empD2').value=this.value; prepEmpItin()">
                        <input id="empD2" type="date" class="p-3 border rounded-xl text-sm" onchange="prepEmpItin()">
                    </div>
                    <div id="empItinFields" class="space-y-3"></div>
                </div>
                <button onclick="submitEmpTO()" class="w-full btn-primary py-4 text-xs tracking-widest shadow-xl">🚀 Submit Travel Order</button>
            </div>`;
        }
        function prepEmpItin() {
            const d1 = document.getElementById('empD1').value, d2 = document.getElementById('empD2').value;
            if(!d1 || !d2) return;
            const container = document.getElementById('empItinFields');
            container.innerHTML = ''; empItin = [];
            let st = new Date(d1), en = new Date(d2);
            while(st <= en) {
                const ds = st.toISOString().split('T')[0];
                container.innerHTML += `<div class="bg-slate-50 p-3 rounded-lg border">
                    <p class="text-[10px] font-black text-slate-500 mb-2 uppercase">${ds}</p>
                    <input id="dest-${ds}" placeholder="Destination" class="w-full p-2 border rounded-lg text-xs mb-2">
                    <textarea id="purp-${ds}" placeholder="Purpose" class="w-full p-2 border rounded-lg text-xs" rows="2"></textarea>
                </div>`;
                empItin.push(ds);
                st.setDate(st.getDate()+1);
            }
        }
        async function submitEmpTO() {
            const d1 = document.getElementById('empD1').value;
            if(!d1 || !empItin.length) return alert("Setup Itinerary");
            
            // Logic for Sequence format YYYY-DIV-XXXXX from context
            const year = new Date().getFullYear();
            const divCode = currentUser.division.substring(0,4).toUpperCase();
            const toNo = `${year}-${divCode}-${Math.floor(10000 + Math.random() * 90000)}`;

            const payload = {
                to_no: toNo, emp_id: currentUser.emp_id, emp_name: currentUser.full_name,
                unit: currentUser.unit, division: currentUser.division, transport: 'LAND',
                status: (currentUser.unit === 'PARPO') ? 'PENDING_PARPO' : (currentUser.unit ? 'PENDING_UNIT_HEAD' : 'PENDING_CHIEF')
            };

            const itinPayload = empItin.map(d => ({
                to_no: toNo, travel_date: d, 
                destination: document.getElementById(`dest-${d}`).value,
                purpose: document.getElementById(`purp-${d}`).value
            }));

            await db.from('travel_orders').insert(payload);
            await db.from('itinerary').insert(itinPayload);
            alert("Submitted: " + toNo);
            renderEmpStatus();
        }

        async function renderEmpStatus() {
            const {data} = await db.from('travel_orders').select('*').eq('emp_id', currentUser.emp_id).order('created_at', {ascending:false}).limit(10);
            document.getElementById('emp-content').innerHTML = `<h3 class="font-black text-dar mb-4 uppercase tracking-widest text-sm">Applications</h3>` + 
            data.map(to => `
                <div class="bg-white p-4 rounded-xl border-l-4 mb-3 ${to.status==='APPROVED'?'border-green-500':'border-dar-gold'}">
                    <div class="flex justify-between items-start">
                        <span class="text-[9px] font-bold text-slate-400">${to.to_no}</span>
                        <span class="text-[9px] font-black uppercase">${to.status.replace(/_/g, ' ')}</span>
                    </div>
                    <p class="font-bold text-xs uppercase mt-1">${to.transport} - ${to.received || 'NO VEHICLE ASSIGNED'}</p>
                </div>`).join('');
        }

        // ==========================================
        // SYSTEM 4: ADMIN CONSOLE (Approvals)
        // ==========================================
        function initAdminConsole() {
            renderAdminUI();
            loadAdminPending();
        }
        function renderAdminUI() {
            document.getElementById('app').innerHTML = `
            <header class="h-16 bg-dar text-white px-5 flex items-center justify-between border-b-2 border-dar-gold">
                <div><h1 class="font-bold text-sm">Admin Console</h1><p class="text-[9px] text-dar-gold uppercase font-bold">${currentUser.full_name} | ${userRole}</p></div>
                <button onclick="logout()" class="text-[10px] font-bold bg-white/20 px-3 py-1 rounded">Logout</button>
            </header>
            <main id="admin-content" class="flex-grow overflow-y-auto p-4"></main>
            <nav class="h-16 bg-white border-t flex items-center">
                <div onclick="loadAdminPending()" class="flex-1 text-center text-[9px] font-black text-dar uppercase">📥 Pending</div>
                <div onclick="loadAdminHistory()" class="flex-1 text-center text-[9px] font-black text-dar uppercase">📜 Archive</div>
            </nav>`;
        }
        async function loadAdminPending() {
            const targetStatus = (userRole === 'UNIT_HEAD') ? 'PENDING_UNIT_HEAD' : (userRole === 'CHIEF' ? 'PENDING_CHIEF' : 'PENDING_PARPO');
            const {data} = await db.from('travel_orders').select('*').eq('status', targetStatus);
            const m = document.getElementById('admin-content');
            if(!data.length) { m.innerHTML = `<p class="text-center p-20 text-slate-300 font-bold uppercase text-[10px]">No Actions Required</p>`; return; }
            
            m.innerHTML = data.map(o => `
            <div class="bg-white p-5 rounded-2xl border shadow-sm mb-4">
                <p class="text-[9px] font-bold text-slate-400 mb-1">${o.to_no}</p>
                <h3 class="font-black text-dar-green uppercase text-sm">${o.emp_name}</h3>
                <p class="text-[10px] text-slate-500 mb-4">${o.transport} | ${o.division}</p>
                <div class="flex gap-2">
                    <button onclick="adminAction('${o.to_no}', 'DISAPPROVED')" class="flex-1 border border-red-500 text-red-500 rounded-xl font-bold py-2.5 text-[10px]">Deny</button>
                    <button onclick="adminAction('${o.to_no}', 'APPROVE')" class="flex-1 btn-primary rounded-xl py-2.5 text-[10px]">Approve</button>
                </div>
            </div>`).join('');
        }
        async function adminAction(toNo, act) {
            let next = '';
            if(act === 'DISAPPROVED') next = 'DISAPPROVED';
            else {
                if(userRole === 'UNIT_HEAD') next = 'PENDING_CHIEF';
                else if(userRole === 'CHIEF') next = 'PENDING_PARPO';
                else next = 'APPROVED';
            }
            const update = { status: next };
            if(userRole === 'UNIT_HEAD') update.unithead_signed = currentUser.full_name;
            if(userRole === 'CHIEF') update.dc_signed = currentUser.full_name;
            if(userRole === 'PARPO') update.parpo_signed = "RICARDO C. GARCIA";

            await db.from('travel_orders').update(update).eq('to_no', toNo);
            loadAdminPending();
        }

        // --- GLOBAL HELPERS ---
        function showChangePwd() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 modal-fade z-[300]';
            modal.id = 'pwd-modal';
            modal.innerHTML = `
                <div class="bg-white w-full max-w-sm rounded-3xl p-8 relative">
                    <button onclick="this.closest('#pwd-modal').remove()" class="absolute top-4 right-4 text-slate-400">✕</button>
                    <h2 class="text-dar font-black text-xl mb-6 border-b pb-2 uppercase tracking-tighter">Security Update</h2>
                    <input type="password" id="new-pw" placeholder="Enter New Password" class="w-full p-4 border rounded-2xl mb-4 outline-none focus:ring-2 focus:ring-dar">
                    <button onclick="executeGlobalPwdUpdate()" class="w-full btn-primary py-4 text-xs">Update My Password</button>
                </div>`;
            document.body.appendChild(modal);
        }
        async function executeGlobalPwdUpdate() {
            const npw = document.getElementById('new-pw').value.trim();
            if(!npw) return alert("Enter password");
            const table = (userRole === 'EMPLOYEE') ? 'employees' : 'users';
            const col = (userRole === 'EMPLOYEE') ? 'pass' : 'password';
            const filterCol = (userRole === 'EMPLOYEE') ? 'emp_id' : 'username';
            const filterVal = (userRole === 'EMPLOYEE') ? currentUser.emp_id : currentUser.username;
            
            await db.from(table).update({ [col]: npw }).eq(filterCol, filterVal);
            alert("Success. Please relogin."); location.reload();
        }
    </script>
</body>
