<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DAR Console</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DAR Console">
    <meta name="theme-color" content="#003811">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link id="pwa-manifest" rel="manifest">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .dar-green { background-color: #003811; }
        .text-dar-green { color: #003811; }
        .dar-gold { background-color: #D4AF37; }
        .text-dar-gold { color: #D4AF37; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
        }
        
        ::-webkit-scrollbar { display: none; }
        .modal-fade { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .batch-bar-position { bottom: calc(4rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden text-gray-800 bg-gray-100">

    <div id="app" class="w-full h-full flex flex-col relative"></div>

    <script>
        const manifestData = {
            "name": "DAR Cam Sur 1 Console",
            "short_name": "DAR Console",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#F3F4F6",
            "theme_color": "#003811",
            "icons": [{
                "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzAwMzgxMSIvPjx0ZXh0IHg9IjUwIiB5PSI2NSIgZm9udC1zaXplPSI1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI0Q0QUYzNyI+RDwvdGV4dD48L3N2Zz4=",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }]
        };
        document.getElementById('pwa-manifest').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData)));

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = "https://ytfpiyfapvybihlngxks.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZnBpeWZhcHZ5YmlobG5neGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMDA2MTIsImV4cCI6MjA4NTY3NjYxMn0.7TRVjvFjxVtxkP_hL3wnlxPT6FXJd0y7aKHNzDHThAQ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentTab = 'pending'; 
        let reportFilter = 'day'; 
        
        let pendingOrders = [];
        let reportData = [];

        const appDiv = document.getElementById('app');

        function render() {
            if (!currentUser) renderLogin();
            else renderMain();
        }

        function renderLogin() {
            appDiv.innerHTML = `
                <div class="flex-grow flex flex-col justify-center items-center px-6 dar-green h-full">
                    <div class="z-10 w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
                        <div class="dar-gold h-2 w-full"></div>
                        <div class="p-8 text-center">
                            <h1 class="text-dar-green font-bold text-3xl font-serif mb-1">DAR</h1>
                            <p class="text-xs text-gray-500 font-bold tracking-widest mb-6 uppercase">Cam Sur 1 Console</p>
                            <div class="space-y-4 text-left">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1 tracking-tighter">USERNAME</label>
                                    <input type="text" id="username" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800" autocomplete="off">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1 tracking-tighter">PASSWORD</label>
                                    <input type="password" id="password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800">
                                </div>
                                <p id="loginError" class="text-red-600 text-[10px] font-bold text-center hidden"></p>
                                <button onclick="handleLogin()" id="loginBtn" class="w-full mt-2 dar-green text-white font-bold py-3.5 rounded-xl active:opacity-80 transition-opacity shadow-lg">
                                    LOG IN
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
        }

        async function handleLogin() {
            const userBox = document.getElementById('username').value.trim();
            const passBox = document.getElementById('password').value.trim();
            const errLbl = document.getElementById('loginError');
            if(!userBox || !passBox) { errLbl.innerText = "Fields Required."; errLbl.classList.remove("hidden"); return; }
            try {
                const { data: users, error } = await supabaseClient.from('users').select('*');
                const user = (users || []).find(u => u.username === userBox && u.password === passBox);
                if (user) {
                    currentUser = {
                        username: user.username,
                        fullName: user.full_name,
                        role: user.role.toUpperCase(),
                        divisions: user.division ? user.division.split(',').map(d => d.trim().toUpperCase()) : [],
                        unit: user.unit ? user.unit.trim().toUpperCase() : ''
                    };
                    render();
                } else {
                    errLbl.innerText = "Invalid Credentials."; errLbl.classList.remove("hidden");
                }
            } catch (err) { errLbl.innerText = "Connection Error."; errLbl.classList.remove("hidden"); }
        }

        function logout() { currentUser = null; render(); }

        function renderMain() {
            appDiv.innerHTML = `
                <header class="flex-none w-full h-16 dar-green text-white px-5 flex justify-between items-center shadow-md z-50">
                    <div class="overflow-hidden">
                        <h1 class="font-bold text-lg leading-tight truncate whitespace-nowrap">${currentUser.fullName}</h1>
                        <p class="text-xs text-dar-gold tracking-wide">${currentUser.role}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="showChangePassword()" class="text-xl px-2 py-1 active:opacity-50">🔒</button>
                        <button onclick="logout()" class="text-xs bg-white bg-opacity-20 px-3 py-1.5 rounded-full font-bold active:bg-opacity-30">Logout</button>
                    </div>
                </header>
                <main id="mainContent" class="flex-grow w-full overflow-y-auto bg-gray-100 relative z-10 scroll-smooth"></main>
                <nav class="flex-none w-full h-16 bg-white border-t border-gray-200 flex z-50 pb-safe shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                    <button onclick="switchTab('pending')" class="flex flex-col items-center justify-center w-1/4 h-full ${currentTab === 'pending' ? 'text-dar-green font-bold' : 'text-gray-400'} relative">
                        ${currentTab === 'pending' ? '<div class="absolute top-0 w-1/2 h-1 dar-green rounded-b-full"></div>' : ''}
                        <span class="text-xl mb-0.5">📥</span>
                        <span class="text-[9px] uppercase tracking-tighter">Pending</span>
                    </button>
                    <button onclick="switchTab('approved')" class="flex flex-col items-center justify-center w-1/4 h-full ${currentTab === 'approved' ? 'text-dar-green font-bold' : 'text-gray-400'} relative">
                        ${currentTab === 'approved' ? '<div class="absolute top-0 w-1/2 h-1 dar-green rounded-b-full"></div>' : ''}
                        <span class="text-xl mb-0.5">✅</span>
                        <span class="text-[9px] uppercase tracking-tighter">Approved</span>
                    </button>
                    <button onclick="switchTab('denied')" class="flex flex-col items-center justify-center w-1/4 h-full ${currentTab === 'denied' ? 'text-red-600 font-bold' : 'text-gray-400'} relative">
                        ${currentTab === 'denied' ? '<div class="absolute top-0 w-1/2 h-1 bg-red-600 rounded-b-full"></div>' : ''}
                        <span class="text-xl mb-0.5">❌</span>
                        <span class="text-[9px] uppercase tracking-tighter">Denied</span>
                    </button>
                    <button onclick="switchTab('reports')" class="flex flex-col items-center justify-center w-1/4 h-full ${currentTab === 'reports' ? 'text-blue-600 font-bold' : 'text-gray-400'} relative">
                        ${currentTab === 'reports' ? '<div class="absolute top-0 w-1/2 h-1 bg-blue-600 rounded-b-full"></div>' : ''}
                        <span class="text-xl mb-0.5">📊</span>
                        <span class="text-[9px] uppercase tracking-tighter">Reports</span>
                    </button>
                </nav>
                <div id="pwdModal" class="hidden absolute inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center px-4 modal-fade">
                    <div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl">
                        <div class="dar-green text-white p-4 font-bold text-center relative">Change Password
                            <button onclick="hideChangePassword()" class="absolute right-4 top-4 text-white opacity-70 text-xl leading-none">✕</button>
                        </div>
                        <div class="p-6 space-y-4">
                            <div><label class="block text-xs font-bold text-gray-700 mb-1">CURRENT</label><input type="password" id="oldPwd" class="w-full px-4 py-2 border rounded-lg"></div>
                            <div><label class="block text-xs font-bold text-gray-700 mb-1">NEW</label><input type="password" id="newPwd" class="w-full px-4 py-2 border rounded-lg"></div>
                            <button onclick="updatePassword()" class="w-full mt-4 dar-green text-white font-bold py-3 rounded-xl">Save Changes</button>
                        </div>
                    </div>
                </div>
            `;
            if (currentTab === 'pending') loadPendingTab();
            else if (currentTab === 'approved') loadStatusTab('APPROVED');
            else if (currentTab === 'denied') loadStatusTab('DISAPPROVED');
            else loadReportsTab();
        }

        function switchTab(tab) { currentTab = tab; renderMain(); }
        function showChangePassword() { document.getElementById('pwdModal').classList.remove('hidden'); }
        function hideChangePassword() { document.getElementById('pwdModal').classList.add('hidden'); }

        async function updatePassword() {
            const oldP = document.getElementById('oldPwd').value.trim();
            const newP = document.getElementById('newPwd').value.trim();
            try {
                const { data: userRecord } = await supabaseClient.from('users').select('password').eq('username', currentUser.username).single();
                if (userRecord.password !== oldP) return alert("Current password incorrect.");
                await supabaseClient.from('users').update({ password: newP }).eq('username', currentUser.username);
                alert("Updated!"); hideChangePassword();
            } catch (err) { alert("Error updating."); }
        }

        async function loadPendingTab() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<div class="flex justify-center items-center h-full"><p class="text-gray-500 animate-pulse font-bold">Syncing...</p></div>`;
            try {
                const [ordersRes, itinRes] = await Promise.all([
                    supabaseClient.from('travel_orders').select('*'),
                    supabaseClient.from('itinerary').select('*')
                ]);
                const orders = ordersRes.data || [];
                const itineraries = itinRes.data || [];
                let grouped = {};
                orders.forEach(o => { if (!grouped[o.to_no]) grouped[o.to_no] = []; grouped[o.to_no].push(o); });

                pendingOrders = [];
                const { role, divisions, unit } = currentUser;
                for (const [to_no, group] of Object.entries(grouped)) {
                    const o = group[0];
                    const stat = (o.status || "").toUpperCase();
                    const transport = (o.transport || "").toUpperCase();
                    let show = false;
                    if (role === "VEHICLE_APPROVER" && stat === "PENDING_VEHICLE_RESERVATION" && transport === "GOV'T VEHICLE") show = true;
                    else if ((role === "UNIT_HEAD" || role === "MARPO") && stat === "PENDING_UNIT_HEAD" && divisions.includes(o.division.toUpperCase()) && o.unit.toUpperCase() === unit) show = true;
                    else if (role === "CHIEF" && stat === "PENDING_CHIEF" && divisions.includes(o.division.toUpperCase())) show = true;
                    else if (role === "PARPO" && stat === "PENDING_PARPO") show = true;

                    if (show) {
                        let itins = itineraries.filter(i => i.to_no === to_no);
                        pendingOrders.push({ to_no, names: group.map(g => g.emp_name), destinations: itins.map(i => i.destination).join(', ') || 'N/A' });
                    }
                }
                renderPendingUI();
            } catch (err) { content.innerHTML = `<p class="p-6 text-red-500">Error loading data.</p>`; }
        }

        function renderPendingUI() {
            const content = document.getElementById('mainContent');
            if (pendingOrders.length === 0) {
                content.innerHTML = `<div class="flex flex-col items-center justify-center h-full opacity-50"><span class="text-5xl">✨</span><p class="font-bold mt-2">Inbox Empty</p></div>`;
                return;
            }
            let html = `<div class="p-4 space-y-4 pb-32">`;
            pendingOrders.forEach(o => {
                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <span class="text-[10px] font-black text-gray-300 uppercase">${o.to_no}</span>
                        <p class="font-bold text-gray-800">${o.names.join(', ')}</p>
                        <p class="text-xs text-gray-500 truncate">📍 ${o.destinations}</p>
                        <div class="flex justify-end space-x-2 mt-4">
                            <button onclick="processSingle('${o.to_no}', 'DISAPPROVED')" class="px-4 py-2 bg-red-50 text-red-600 rounded-lg text-xs font-bold">Deny</button>
                            <button onclick="processSingle('${o.to_no}', 'APPROVE')" class="px-4 py-2 dar-green text-white rounded-lg text-xs font-bold">Approve</button>
                        </div>
                    </div>`;
            });
            content.innerHTML = html + `</div>`;
        }

        async function processSingle(to_no, action) {
            let payload = action === 'DISAPPROVED' ? { status: "DISAPPROVED", received: prompt("Reason:") } : getApprovePayload(currentUser);
            if(payload.status === "DISAPPROVED" && !payload.received) return;
            await supabaseClient.from('travel_orders').update(payload).eq('to_no', to_no);
            loadPendingTab();
        }

        function getApprovePayload(u) {
            if (u.role === "UNIT_HEAD" || u.role === "MARPO") return { status: "PENDING_CHIEF", unithead_signed: u.fullName };
            if (u.role === "CHIEF") return { status: "PENDING_PARPO", dc_signed: u.fullName };
            if (u.role === "PARPO") return { status: "APPROVED", parpo_signed: "RICARDO C. GARCIA" };
            return {};
        }

        async function loadStatusTab(status) {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<p class="p-10 text-center animate-pulse">Loading...</p>`;
            const { data: orders } = await supabaseClient.from('travel_orders').select('*').eq('status', status);
            const { data: itin } = await supabaseClient.from('itinerary').select('*');
            let html = `<div class="p-4 space-y-3">`;
            (orders || []).forEach(o => {
                let d = (itin || []).find(i => i.to_no === o.to_no)?.travel_date || 'N/A';
                html += `<div class="bg-white p-4 rounded-xl border border-gray-100"><p class="text-[10px] font-bold text-dar-green">${status}</p><p class="font-bold">${o.emp_name}</p><p class="text-xs text-gray-400">📅 ${d}</p></div>`;
            });
            content.innerHTML = html + `</div>`;
        }

        // --- UPDATED REPORTS TAB (PSO, HOLIDAY, TO) ---
        async function loadReportsTab() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<div class="flex items-center justify-center h-full text-blue-500 font-bold animate-pulse">Building Dashboard...</div>`;
            try {
                const [toRes, itinRes, psoRes, holRes] = await Promise.all([
                    supabaseClient.from('travel_orders').select('*').eq('status', 'APPROVED'),
                    supabaseClient.from('itinerary').select('*'),
                    supabaseClient.from('pso_records').select('*'),
                    supabaseClient.from('holidays').select('*')
                ]);

                reportData = [];
                const tos = toRes.data || [];
                const itins = itinRes.data || [];
                const psos = psoRes.data || [];
                const hols = holRes.data || [];

                itins.forEach(i => {
                    const parent = tos.find(t => t.to_no === i.to_no);
                    if(parent && i.travel_date) {
                        reportData.push({ type: 'TO', date: new Date(i.travel_date), name: parent.emp_name, dest: i.destination, color: 'blue' });
                    }
                });

                psos.forEach(p => {
                    if(p.date) reportData.push({ type: 'PSO', date: new Date(p.date), name: p.emp_name || 'Personnel', dest: p.destination || 'Provincial', color: 'purple' });
                });

                hols.forEach(h => {
                    if(h.date) reportData.push({ type: 'HOLIDAY', date: new Date(h.date), name: h.name, dest: 'National/Local', color: 'red' });
                });

                renderReportsShell();
            } catch (e) { content.innerHTML = `<p class="p-6 text-red-500">Error syncing dashboard.</p>`; }
        }

        function renderReportsShell() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="sticky top-0 bg-gray-100 z-20 pt-4 px-4 pb-2 border-b">
                    <h2 class="font-bold text-lg text-blue-800 mb-3 text-center">Activity Dashboard</h2>
                    <div class="flex bg-gray-200 rounded-xl p-1 mb-2">
                        <button id="btn-day" onclick="setReportFilter('day')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'day' ? 'bg-white text-blue-700' : 'text-gray-500'}">Today</button>
                        <button id="btn-week" onclick="setReportFilter('week')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'week' ? 'bg-white text-blue-700' : 'text-gray-500'}">Week</button>
                        <button id="btn-month" onclick="setReportFilter('month')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'month' ? 'bg-white text-blue-700' : 'text-gray-500'}">Month</button>
                    </div>
                    <input type="text" id="reportSearch" placeholder="🔍 Search..." oninput="updateReportList()" class="w-full px-4 py-2 rounded-xl border text-sm">
                </div>
                <div id="reportListContainer" class="p-4 space-y-3 pb-20"></div>
            `;
            updateReportList();
        }

        function setReportFilter(val) { reportFilter = val; renderReportsShell(); }

        function updateReportList() {
            const container = document.getElementById('reportListContainer');
            const query = document.getElementById('reportSearch').value.toLowerCase();
            const today = new Date(); today.setHours(0,0,0,0);

            let filtered = reportData.filter(r => {
                const d = new Date(r.date); d.setHours(0,0,0,0);
                if (reportFilter === 'day') return d.getTime() === today.getTime();
                if (reportFilter === 'week') {
                    const start = new Date(today); start.setDate(today.getDate() - today.getDay());
                    const end = new Date(start); end.setDate(start.getDate() + 6);
                    return d >= start && d <= end;
                }
                if (reportFilter === 'month') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
                return true;
            });

            if (query) filtered = filtered.filter(r => r.name.toLowerCase().includes(query));

            // SORTING: Month view is 1st onwards (Ascending). Others are Latest (Descending).
            if (reportFilter === 'month') filtered.sort((a, b) => a.date - b.date);
            else filtered.sort((a, b) => b.date - a.date);

            if (filtered.length === 0) { container.innerHTML = `<p class="text-center py-10 text-gray-400 font-bold text-xs uppercase tracking-widest">No Activity Found</p>`; return; }

            let html = '';
            let lastDate = '';
            filtered.forEach(r => {
                const dStr = r.date.toDateString();
                if (dStr !== lastDate) {
                    lastDate = dStr;
                    html += `<h3 class="text-[10px] font-black text-gray-400 mt-6 mb-2 uppercase tracking-widest border-b pb-1">${r.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</h3>`;
                }
                const colors = { blue: 'border-blue-500 bg-blue-50 text-blue-800', purple: 'border-purple-500 bg-purple-50 text-purple-800', red: 'border-red-500 bg-red-50 text-red-800' }[r.color];
                html += `
                    <div class="bg-white p-3 rounded-xl border-l-4 shadow-sm flex items-center justify-between ${colors.split(' ')[0]}">
                        <div class="overflow-hidden">
                            <p class="font-bold text-sm text-gray-800 truncate">${r.name}</p>
                            <p class="text-[10px] text-gray-500 truncate">📍 ${r.dest || 'N/A'}</p>
                        </div>
                        <div class="shrink-0 ml-2">
                            <span class="text-[9px] font-black px-2 py-1 rounded-md uppercase ${colors.split(' ').slice(1).join(' ')}">${r.type}</span>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        window.onload = render;
    </script>
</body>
</html>
