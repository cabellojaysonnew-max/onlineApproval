<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DAR Console</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DAR Console">
    <meta name="theme-color" content="#003811">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link id="pwa-manifest" rel="manifest">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .dar-green { background-color: #003811; }
        .text-dar-green { color: #003811; }
        .dar-gold { background-color: #D4AF37; }
        .text-dar-gold { color: #D4AF37; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
        }
        
        ::-webkit-scrollbar { display: none; }
        .modal-fade { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .batch-bar-position { bottom: calc(4rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden text-gray-800 bg-gray-100">

    <div id="app" class="w-full h-full flex flex-col relative"></div>

    <script>
        const manifestData = {
            "name": "DAR Cam Sur 1 Console",
            "short_name": "DAR Console",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#F3F4F6",
            "theme_color": "#003811",
            "icons": [{
                "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzAwMzgxMSIvPjx0ZXh0IHg9IjUwIiB5PSI2NSIgZm9udC1zaXplPSI1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI0Q0QUYzNyI+RDwvdGV4dD48L3N2Zz4=",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }]
        };
        document.getElementById('pwa-manifest').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData)));

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = "https://ytfpiyfapvybihlngxks.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZnBpeWZhcHZ5YmlobG5neGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMDA2MTIsImV4cCI6MjA4NTY3NjYxMn0.7TRVjvFjxVtxkP_hL3wnlxPT6FXJd0y7aKHNzDHThAQ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentTab = 'pending'; 
        let reportFilter = 'month'; 
        let reportData = [];

        const appDiv = document.getElementById('app');

        function render() {
            if (!currentUser) renderLogin();
            else renderMain();
        }

        function renderLogin() {
            appDiv.innerHTML = `
                <div class="flex-grow flex flex-col justify-center items-center px-6 dar-green h-full">
                    <div class="z-10 w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
                        <div class="dar-gold h-2 w-full"></div>
                        <div class="p-8 text-center text-left">
                            <h1 class="text-dar-green font-bold text-3xl font-serif mb-1">DAR</h1>
                            <p class="text-[10px] text-gray-400 font-bold tracking-widest mb-6 uppercase">Cam Sur 1 Console</p>
                            <div class="space-y-4">
                                <div><label class="block text-xs font-bold text-gray-700 mb-1 text-left">USERNAME</label><input type="text" id="username" class="w-full px-4 py-3 bg-gray-50 border rounded-xl focus:outline-none"></div>
                                <div><label class="block text-xs font-bold text-gray-700 mb-1 text-left">PASSWORD</label><input type="password" id="password" class="w-full px-4 py-3 bg-gray-50 border rounded-xl focus:outline-none"></div>
                                <p id="loginError" class="text-red-600 text-[10px] font-bold hidden"></p>
                                <button onclick="handleLogin()" id="loginBtn" class="w-full mt-2 dar-green text-white font-bold py-3.5 rounded-xl shadow-lg">LOG IN</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
        }

        async function handleLogin() {
            const userBox = document.getElementById('username').value.trim();
            const passBox = document.getElementById('password').value.trim();
            const errLbl = document.getElementById('loginError');
            try {
                const { data: users } = await supabaseClient.from('users').select('*');
                const user = (users || []).find(u => u.username === userBox && u.password === passBox);
                if (user) {
                    currentUser = { username: user.username, fullName: user.full_name, role: user.role.toUpperCase(), divisions: user.division ? user.division.split(',').map(d => d.trim().toUpperCase()) : [], unit: user.unit ? user.unit.trim().toUpperCase() : '' };
                    render();
                } else { errLbl.innerText = "Check credentials."; errLbl.classList.remove("hidden"); }
            } catch (err) { errLbl.innerText = "Connection Error."; errLbl.classList.remove("hidden"); }
        }

        function logout() { currentUser = null; render(); }

        function renderMain() {
            appDiv.innerHTML = `
                <header class="flex-none w-full h-16 dar-green text-white px-5 flex justify-between items-center shadow-md z-50">
                    <div class="overflow-hidden text-left"><h1 class="font-bold text-lg leading-tight truncate">${currentUser.fullName}</h1><p class="text-[10px] text-dar-gold tracking-wide font-bold uppercase">${currentUser.role}</p></div>
                    <div class="flex items-center space-x-2"><button onclick="showChangePassword()" class="text-xl px-2">🔒</button><button onclick="logout()" class="text-xs bg-white/20 px-3 py-1.5 rounded-full font-bold">Logout</button></div>
                </header>
                <main id="mainContent" class="flex-grow w-full overflow-y-auto bg-gray-100 relative z-10 scroll-smooth"></main>
                <nav class="flex-none w-full h-16 bg-white border-t flex z-50 pb-safe shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                    <button onclick="switchTab('pending')" class="flex flex-col items-center justify-center w-1/4 ${currentTab === 'pending' ? 'text-dar-green font-bold' : 'text-gray-400'}"><span class="text-xl">📥</span><span class="text-[9px] uppercase tracking-tighter">Pending</span></button>
                    <button onclick="switchTab('approved')" class="flex flex-col items-center justify-center w-1/4 ${currentTab === 'approved' ? 'text-dar-green font-bold' : 'text-gray-400'}"><span class="text-xl">✅</span><span class="text-[9px] uppercase tracking-tighter">Approved</span></button>
                    <button onclick="switchTab('denied')" class="flex flex-col items-center justify-center w-1/4 ${currentTab === 'denied' ? 'text-red-600 font-bold' : 'text-gray-400'}"><span class="text-xl">❌</span><span class="text-[9px] uppercase tracking-tighter">Denied</span></button>
                    <button onclick="switchTab('reports')" class="flex flex-col items-center justify-center w-1/4 ${currentTab === 'reports' ? 'text-blue-600 font-bold' : 'text-gray-400'}"><span class="text-xl">📊</span><span class="text-[9px] uppercase tracking-tighter">Reports</span></button>
                </nav>
                <div id="pwdModal" class="hidden absolute inset-0 bg-black/50 z-[60] flex items-center justify-center px-4 modal-fade"><div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl"><div class="dar-green text-white p-4 font-bold text-center relative">Security<button onclick="hideChangePassword()" class="absolute right-4 text-xl leading-none">✕</button></div><div class="p-6 space-y-4"><input type="password" id="oldPwd" placeholder="Current Password" class="w-full px-4 py-2 border rounded-lg text-sm"><input type="password" id="newPwd" placeholder="New Password" class="w-full px-4 py-2 border rounded-lg text-sm"><button onclick="updatePassword()" class="w-full dar-green text-white font-bold py-3 rounded-xl">Save</button></div></div></div>`;
            
            if (currentTab === 'pending') loadPendingTab();
            else if (currentTab === 'approved') loadStatusTab('APPROVED');
            else if (currentTab === 'denied') loadStatusTab('DISAPPROVED');
            else loadReportsTab();
        }

        function switchTab(tab) { currentTab = tab; renderMain(); }
        function showChangePassword() { document.getElementById('pwdModal').classList.remove('hidden'); }
        function hideChangePassword() { document.getElementById('pwdModal').classList.add('hidden'); }

        async function updatePassword() {
            const oldP = document.getElementById('oldPwd').value.trim();
            const newP = document.getElementById('newPwd').value.trim();
            const { data: userRecord } = await supabaseClient.from('users').select('password').eq('username', currentUser.username).single();
            if (userRecord.password !== oldP) return alert("Current password incorrect.");
            await supabaseClient.from('users').update({ password: newP }).eq('username', currentUser.username);
            alert("Security Updated!"); hideChangePassword();
        }

        // --- PENDING / STATUS TAB HELPERS ---
        async function loadPendingTab() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<p class="flex items-center justify-center h-full text-gray-400 font-bold animate-pulse">Syncing Inbox...</p>`;
            const [ordersRes, itinRes] = await Promise.all([supabaseClient.from('travel_orders').select('*'), supabaseClient.from('itinerary').select('*')]);
            let grouped = {};
            (ordersRes.data || []).forEach(o => { if (!grouped[o.to_no]) grouped[o.to_no] = []; grouped[o.to_no].push(o); });
            pendingOrders = [];
            for (const [to_no, group] of Object.entries(grouped)) {
                const o = group[0];
                const stat = (o.status || "").toUpperCase();
                const div = (o.division || "").toUpperCase();
                const unit = (o.unit || "").toUpperCase();
                let show = false;
                if (currentUser.role === "VEHICLE_APPROVER" && stat === "PENDING_VEHICLE_RESERVATION") show = true;
                else if (currentUser.role === "PARPO" && stat === "PENDING_PARPO") show = true;
                else if (currentUser.role === "CHIEF" && stat === "PENDING_CHIEF" && currentUser.divisions.includes(div)) show = true;
                else if ((currentUser.role === "UNIT_HEAD" || currentUser.role === "MARPO") && stat === "PENDING_UNIT_HEAD" && currentUser.divisions.includes(div) && currentUser.unit === unit) show = true;
                if (show) {
                    let itins = (itinRes.data || []).filter(i => i.to_no === to_no);
                    pendingOrders.push({ to_no, names: group.map(g => g.emp_name), destinations: itins.map(i => i.destination).join(', ') || 'N/A' });
                }
            }
            renderPendingUI();
        }

        function renderPendingUI() {
            const content = document.getElementById('mainContent');
            if (pendingOrders.length === 0) { content.innerHTML = `<div class="flex flex-col items-center justify-center h-full opacity-50"><span class="text-4xl">✨</span><p class="font-bold mt-2 text-xs">Inbox Clear</p></div>`; return; }
            let html = `<div class="p-4 space-y-4 pb-32">`;
            pendingOrders.forEach(o => {
                html += `<div class="bg-white p-4 rounded-2xl shadow-sm border"><span class="text-[10px] font-black text-gray-300 uppercase tracking-tighter text-left block">${o.to_no}</span><p class="font-bold text-gray-800 text-left">${o.names.join(', ')}</p><p class="text-xs text-gray-600 truncate text-left">📍 ${o.destinations}</p><div class="flex justify-end space-x-2 mt-4"><button onclick="processSingle('${o.to_no}', 'DISAPPROVED')" class="px-5 py-2 bg-red-50 text-red-600 rounded-xl text-[11px] font-bold">Deny</button><button onclick="processSingle('${o.to_no}', 'APPROVE')" class="px-5 py-2 dar-green text-white rounded-xl text-[11px] font-bold">Approve</button></div></div>`;
            });
            content.innerHTML = html + `</div>`;
        }

        async function processSingle(to_no, action) {
            let payload = action === 'DISAPPROVED' ? { status: "DISAPPROVED", received: prompt("Reason for Denial:") } : getApprovePayload(currentUser);
            if(payload.status === "DISAPPROVED" && !payload.received) return;
            await supabaseClient.from('travel_orders').update(payload).eq('to_no', to_no);
            loadPendingTab();
        }

        function getApprovePayload(u) {
            if (u.role === "UNIT_HEAD" || u.role === "MARPO") return { status: "PENDING_CHIEF", unithead_signed: u.fullName };
            if (u.role === "CHIEF") return { status: "PENDING_PARPO", dc_signed: u.fullName };
            if (u.role === "PARPO") return { status: "APPROVED", parpo_signed: "RICARDO C. GARCIA" };
            return {};
        }

        async function loadStatusTab(status) {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<p class="flex items-center justify-center h-full font-bold animate-pulse text-gray-400">Loading...</p>`;
            const { data: orders } = await supabaseClient.from('travel_orders').select('*').eq('status', status);
            let html = `<div class="p-4 space-y-3">`;
            (orders || []).forEach(o => {
                const div = (o.division || "").toUpperCase();
                const unit = (o.unit || "").toUpperCase();
                let canSee = false;
                if (currentUser.role === "PARPO" || currentUser.role === "VEHICLE_APPROVER") canSee = true;
                else if (currentUser.role === "CHIEF" && currentUser.divisions.includes(div)) canSee = true;
                else if ((currentUser.role === "UNIT_HEAD" || currentUser.role === "MARPO") && currentUser.divisions.includes(div) && currentUser.unit === unit) canSee = true;
                
                if (canSee) {
                    html += `<div class="bg-white p-4 rounded-xl border-l-4 ${status === 'APPROVED' ? 'border-dar-green' : 'border-red-500'} text-left"><p class="text-[9px] font-black uppercase text-gray-400">${status}</p><p class="font-bold text-gray-800">${o.emp_name}</p><p class="text-[10px] text-gray-500 tracking-tighter">${o.to_no}</p></div>`;
                }
            });
            content.innerHTML = html + `</div>`;
        }

        // --- DASHBOARD (Strict Scope + Actual Holiday Names + Chrono Sort) ---
        async function loadReportsTab() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<div class="flex items-center justify-center h-full text-blue-500 font-bold animate-pulse">Building Activity Dashboard...</div>`;
            try {
                const [toRes, itinRes, psoRes, holRes] = await Promise.all([
                    supabaseClient.from('travel_orders').select('*').eq('status', 'APPROVED'),
                    supabaseClient.from('itinerary').select('*'),
                    supabaseClient.from('pso_records').select('*'),
                    supabaseClient.from('holidays').select('*')
                ]);

                reportData = [];
                const uRole = currentUser.role;
                const uDivs = currentUser.divisions;
                const uUnit = currentUser.unit;

                // SCOPE HELPER: Strict filtering for Unit Heads and Chiefs
                const inScope = (recordDiv, recordUnit) => {
                    if (uRole === "PARPO" || uRole === "VEHICLE_APPROVER") return true;
                    const divMatch = recordDiv && uDivs.includes(recordDiv.toUpperCase());
                    if (uRole === "CHIEF") return divMatch;
                    const unitMatch = recordUnit && recordUnit.toUpperCase() === uUnit;
                    return divMatch && unitMatch;
                };

                // 1. TRAVEL ORDERS (De-duplicated per Person/Day)
                let seenKeys = new Set();
                (itinRes.data || []).forEach(i => {
                    const parent = (toRes.data || []).find(t => t.to_no === i.to_no);
                    if(parent && i.travel_date && inScope(parent.division, parent.unit)) {
                        const uniqueKey = `${parent.emp_name}-${i.travel_date}`;
                        if (!seenKeys.has(uniqueKey)) {
                            reportData.push({ type: 'TO', date: new Date(i.travel_date), title: parent.emp_name, subtitle: i.destination, color: 'blue' });
                            seenKeys.add(uniqueKey);
                        }
                    }
                });

                // 2. PSOs (Scoped)
                (psoRes.data || []).forEach(p => {
                    if(p.date && inScope(p.division, p.unit)) {
                        reportData.push({ type: 'PSO', date: new Date(p.date), title: p.emp_name || 'Personnel', subtitle: p.destination || 'Field Duty', color: 'purple' });
                    }
                });

                // 3. HOLIDAYS (Visible to everyone, Specific Name as Title)
                (holRes.data || []).forEach(h => {
                    if(h.date) {
                        const hActualName = h.holiday || h.name || "Special Holiday";
                        reportData.push({ type: 'HOLIDAY', date: new Date(h.date), title: hActualName, subtitle: 'Department-wide', color: 'red' });
                    }
                });

                renderReportsShell();
            } catch (e) { content.innerHTML = `<p class="p-10 text-red-500">Syncing Error.</p>`; }
        }

        function renderReportsShell() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="sticky top-0 bg-gray-100 z-20 pt-4 px-4 pb-2 border-b shadow-sm">
                    <h2 class="font-bold text-lg text-blue-900 mb-3 text-center tracking-tighter">Activity Analytics</h2>
                    <div class="flex bg-gray-200 rounded-xl p-1 mb-3">
                        <button id="btn-day" onclick="setReportFilter('day')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'day' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-500'}">Today</button>
                        <button id="btn-week" onclick="setReportFilter('week')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'week' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-500'}">Week</button>
                        <button id="btn-month" onclick="setReportFilter('month')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'month' ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-500'}">Month</button>
                    </div>
                </div>
                <div id="reportListContainer" class="p-4 space-y-4 pb-20"></div>`;
            updateReportList();
        }

        function setReportFilter(val) { reportFilter = val; renderReportsShell(); }

        function updateReportList() {
            const container = document.getElementById('reportListContainer');
            const today = new Date(); today.setHours(0,0,0,0);

            let filtered = reportData.filter(r => {
                const d = new Date(r.date); d.setHours(0,0,0,0);
                if (reportFilter === 'day') return d.getTime() === today.getTime();
                if (reportFilter === 'week') {
                    const sow = new Date(today); sow.setDate(today.getDate() - today.getDay());
                    const eow = new Date(sow); eow.setDate(sow.getDate() + 6);
                    return d >= sow && d <= eow;
                }
                if (reportFilter === 'month') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
                return true;
            });

            // SORTING: Start with 1 onwards (Ascending) for month view. Others Descending.
            if (reportFilter === 'month') filtered.sort((a, b) => a.date - b.date);
            else filtered.sort((a, b) => b.date - a.date);

            if (filtered.length === 0) { container.innerHTML = `<p class="text-center py-20 text-gray-400 font-bold text-xs tracking-widest uppercase">No Activity Found</p>`; return; }

            let html = '';
            let lastDate = '';
            filtered.forEach(r => {
                const dStr = r.date.toDateString();
                // Date Header above the group
                if (dStr !== lastDate) {
                    lastDate = dStr;
                    const dateLabel = r.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
                    html += `<h3 class="text-[10px] font-black text-gray-400 mt-6 mb-2 tracking-widest text-left border-b pb-1">${dateLabel}</h3>`;
                }

                const colorMap = { blue: 'border-blue-500 bg-blue-50 text-blue-800', purple: 'border-purple-500 bg-purple-50 text-purple-800', red: 'border-red-500 bg-red-50 text-red-800' };
                const colors = colorMap[r.color];

                html += `
                    <div class="bg-white p-4 rounded-2xl border-l-4 shadow-sm flex items-center justify-between text-left ${colors.split(' ')[0]}">
                        <div class="overflow-hidden">
                            <p class="font-bold text-sm text-gray-800 truncate leading-tight">${r.title}</p>
                            <p class="text-[10px] text-gray-500 truncate mt-1">📍 ${r.subtitle || 'N/A'}</p>
                        </div>
                        <div class="shrink-0 ml-2">
                            <span class="text-[8px] font-black px-2 py-1 rounded-md uppercase ${colors.split(' ').slice(1).join(' ')}">${r.type}</span>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        window.onload = render;
    </script>
</body>
</html>
