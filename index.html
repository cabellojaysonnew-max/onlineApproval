<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Order QR Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f4f9; 
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .user-selection {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 6px;
        }
        select {
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 80%;
            max-width: 300px;
            margin-top: 5px;
        }
        #reader { 
            width: 100%; 
            margin: 20px auto; 
        }
        .controls { 
            text-align: center; 
            margin-bottom: 20px; 
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            border: none;
            border-radius: 4px;
            background-color: #0056b3;
            color: white;
            font-weight: bold;
        }
        button:hover { background-color: #004494; }
        .mode-active { background-color: #28a745; }
        .mode-active:hover { background-color: #218838; }
        #result {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }
        .report-section {
            margin-top: 40px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">Travel Order Document Tracker</h2>
    
    <div class="user-selection">
        <label for="parpo-user"><strong>Select User (PARPO Division):</strong></label><br>
        <select id="parpo-user">
            <option value="">Loading PARPO employees...</option>
        </select>
    </div>

    <div class="controls">
        <button id="btn-receive" class="mode-active" onclick="setMode('receive')">Mode: RECEIVE</button>
        <button id="btn-release" onclick="setMode('release')">Mode: RELEASE</button>
    </div>
    <p style="text-align: center;">Currently Scanning To: <strong id="current-mode" style="text-transform: uppercase;">receive</strong></p>

    <div id="reader"></div>
    <div id="result"></div>

    <div class="report-section">
        <h3>Receiving / Releasing Report</h3>
        <button onclick="generateReport()">Generate Recent Report</button>
        <table id="report-table">
            <thead>
                <tr>
                    <th>TO Number</th>
                    <th>Employee Name</th>
                    <th>Received</th>
                    <th>Released</th>
                </tr>
            </thead>
            <tbody id="report-body">
                <tr><td colspan="4" style="text-align:center;">Click generate to load data</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. Initialize Supabase
    // Make sure to replace with your actual project URL. The key is what you provided.
    const supabaseUrl = 'YOUR_SUPABASE_PROJECT_URL'; 
    const supabaseKey = 'sb_publishable_poSZUQ9HI4wcY9poEo5b1w_Z-pAJbKo';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentMode = 'receive';
    let html5QrcodeScanner;

    // 2. Fetch PARPO Employees for Dropdown
    async function loadParpoEmployees() {
        const selectElement = document.getElementById('parpo-user');
        
        const { data, error } = await supabase
            .from('employee')
            .select('full_name')
            .eq('division', 'PARPO')
            .order('full_name', { ascending: true });

        if (error) {
            selectElement.innerHTML = `<option value="">Error loading users</option>`;
            console.error('Error fetching employees:', error);
            return;
        }

        if (data && data.length > 0) {
            selectElement.innerHTML = `<option value="" disabled selected>-- Select your name --</option>`;
            data.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.full_name;
                option.textContent = emp.full_name;
                selectElement.appendChild(option);
            });
        } else {
            selectElement.innerHTML = `<option value="">No PARPO employees found</option>`;
        }
    }

    // Call immediately on load
    loadParpoEmployees();

    // 3. UI Mode Switcher
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('current-mode').innerText = mode;
        
        if(mode === 'receive') {
            document.getElementById('btn-receive').classList.add('mode-active');
            document.getElementById('btn-release').classList.remove('mode-active');
        } else {
            document.getElementById('btn-release').classList.add('mode-active');
            document.getElementById('btn-receive').classList.remove('mode-active');
        }
    }

    // 4. 12-Hour Format Helper (Strictly Enforced)
    function format12Hour(date) {
        let hours = date.getHours();
        let minutes = date.getMinutes();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // the hour '0' should be '12'
        minutes = minutes < 10 ? '0' + minutes : minutes;
        
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const year = date.getFullYear();
        
        return `${year}-${month}-${day} ${hours}:${minutes} ${ampm}`;
    }

    // 5. Handle Successful QR Scan
    async function onScanSuccess(decodedText, decodedResult) {
        const resultDiv = document.getElementById('result');
        const selectedUser = document.getElementById('parpo-user').value;

        // Ensure a user is selected before processing
        if (!selectedUser) {
            resultDiv.innerText = "Error: Please select a user from the dropdown first.";
            resultDiv.style.color = 'red';
            return;
        }

        resultDiv.innerText = `Scanned: ${decodedText}. Updating database...`;
        resultDiv.style.color = '#333';
        
        // Pause scanner to prevent duplicate scans
        html5QrcodeScanner.pause();

        const timestamp = format12Hour(new Date());
        const stampWithUser = `${timestamp} by ${selectedUser}`;
        const updateData = {};

        if (currentMode === 'receive') {
            updateData.received = stampWithUser;
        } else {
            updateData.released = stampWithUser;
        }

        // 6. Update Supabase Database
        const { data, error } = await supabase
            .from('travel_orders')
            .update(updateData)
            .eq('to_no', decodedText.trim()); 

        if (error) {
            resultDiv.innerText = `Error updating TO ${decodedText}: ${error.message}`;
            resultDiv.style.color = 'red';
        } else {
            resultDiv.innerText = `Success: TO ${decodedText} marked as ${currentMode.toUpperCase()}`;
            resultDiv.style.color = 'green';
            // Automatically refresh the report if it's visible
            generateReport();
        }

        // Resume scanner after 3 seconds
        setTimeout(() => {
            resultDiv.innerText = '';
            html5QrcodeScanner.resume();
        }, 3000);
    }

    function onScanFailure(error) {
        // Safe to ignore frame-by-frame failures while searching for a QR code
    }

    // 7. Initialize the Scanner
    html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        { fps: 10, qrbox: {width: 250, height: 250} },
        /* verbose= */ false
    );
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    // 8. Report Generation Logic
    async function generateReport() {
        const tbody = document.getElementById('report-body');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Loading...</td></tr>';

        // Fetch records where received OR released has data
        const { data, error } = await supabase
            .from('travel_orders')
            .select('to_no, emp_name, received, released')
            .or('received.not.is.null, released.not.is.null')
            .order('id', { ascending: false })
            .limit(50); // Grabs recent 50

        if (error) {
            tbody.innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Error: ${error.message}</td></tr>`;
            return;
        }

        tbody.innerHTML = '';
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records found.</td></tr>';
            return;
        }

        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.to_no || '-'}</td>
                <td>${item.emp_name || '-'}</td>
                <td>${item.received || '-'}</td>
                <td>${item.released || '-'}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
