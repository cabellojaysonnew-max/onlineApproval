<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DAR Console</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DAR Console">
    <meta name="theme-color" content="#003811">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link id="pwa-manifest" rel="manifest">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .dar-green { background-color: #003811; }
        .text-dar-green { color: #003811; }
        .dar-gold { background-color: #D4AF37; }
        .text-dar-gold { color: #D4AF37; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
        }
        
        ::-webkit-scrollbar { display: none; }
        .modal-fade { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .batch-bar-position { bottom: calc(4rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden text-gray-800 bg-gray-100">

    <div id="app" class="w-full h-full flex flex-col relative"></div>

    <script>
        const manifestData = {
            "name": "DAR Cam Sur 1 Console",
            "short_name": "DAR Console",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#F3F4F6",
            "theme_color": "#003811",
            "icons": [{
                "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzAwMzgxMSIvPjx0ZXh0IHg9IjUwIiB5PSI2NSIgZm9udC1zaXplPSI1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI0Q0QUYzNyI+RDwvdGV4dD48L3N2Zz4=",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }]
        };
        document.getElementById('pwa-manifest').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData)));

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = "https://ytfpiyfapvybihlngxks.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZnBpeWZhcHZ5YmlobG5neGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMDA2MTIsImV4cCI6MjA4NTY3NjYxMn0.7TRVjvFjxVtxkP_hL3wnlxPT6FXJd0y7aKHNzDHThAQ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentTab = 'pending'; 
        let reportFilter = 'day'; 
        
        let pendingOrders = [];
        let reportData = [];

        const appDiv = document.getElementById('app');

        function render() {
            if (!currentUser) renderLogin();
            else renderMain();
        }

        function renderLogin() {
            appDiv.innerHTML = `
                <div class="flex-grow flex flex-col justify-center items-center px-6 dar-green h-full text-white">
                    <div class="z-10 w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
                        <div class="dar-gold h-2 w-full"></div>
                        <div class="p-8 text-center">
                            <h1 class="text-dar-green font-bold text-3xl font-serif mb-1">DAR</h1>
                            <p class="text-xs text-gray-500 font-bold tracking-widest mb-6 uppercase">Cam Sur 1 Console</p>
                            <div class="space-y-4 text-left">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">USERNAME</label>
                                    <input type="text" id="username" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800 text-gray-800" autocomplete="off">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">PASSWORD</label>
                                    <input type="password" id="password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800 text-gray-800">
                                </div>
                                <p id="loginError" class="text-red-600 text-xs font-bold text-center hidden"></p>
                                <button onclick="handleLogin()" id="loginBtn" class="w-full mt-2 dar-green text-white font-bold py-3.5 rounded-xl active:opacity-80 transition-opacity shadow-lg">
                                    LOG IN
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
        }

        async function handleLogin() {
            const userBox = document.getElementById('username').value.trim();
            const passBox = document.getElementById('password').value.trim();
            const errLbl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            if(!userBox || !passBox) { errLbl.innerText = "Enter both fields."; errLbl.classList.remove("hidden"); return; }
            btn.innerText = "AUTHENTICATING..."; btn.disabled = true;
            try {
                const { data: users, error } = await supabaseClient.from('users').select('*');
                if (error) throw error;
                const user = users.find(u => u.username === userBox && u.password === passBox);
                if (user) {
                    currentUser = {
                        username: user.username,
                        fullName: user.full_name,
                        role: user.role.toUpperCase(),
                        divisions: user.division ? user.division.split(',').map(d => d.trim().toUpperCase()) : [],
                        unit: user.unit ? user.unit.trim().toUpperCase() : ''
                    };
                    render();
                } else {
                    errLbl.innerText = "Invalid credentials."; errLbl.classList.remove("hidden");
                }
            } catch (err) {
                errLbl.innerText = "Network Error."; errLbl.classList.remove("hidden");
            } finally {
                btn.innerText = "LOG IN"; btn.disabled = false;
            }
        }

        function logout() { currentUser = null; render(); }

        function renderMain() {
            appDiv.innerHTML = `
                <header class="flex-none w-full h-16 dar-green text-white px-5 flex justify-between items-center shadow-md z-50">
                    <div class="overflow-hidden text-left">
                        <h1 class="font-bold text-lg leading-tight truncate whitespace-nowrap">${currentUser.fullName}</h1>
                        <p class="text-xs text-dar-gold tracking-wide">${currentUser.role}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="showChangePassword()" class="text-xl px-2 py-1 active:opacity-50">🔒</button>
                        <button onclick="logout()" class="text-xs bg-white bg-opacity-20 px-3 py-1.5 rounded-full font-bold active:bg-opacity-30">Logout</button>
                    </div>
                </header>
                <main id="mainContent" class="flex-grow w-full overflow-y-auto bg-gray-100 relative z-10 scroll-smooth"></main>
                <nav class="flex-none w-full h-16 bg-white border-t border-gray-200 flex z-50 pb-safe shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                    <button onclick="switchTab('pending')" class="flex flex-col items-center justify-center w-1/4 h-full ${currentTab === 'pending' ? 'text-dar-green font-bold' : 'text-gray-400'} relative">
                        ${currentTab === 'pending' ? '<div class="absolute top-0 w-1/2 h-1 dar-green rounded-b-full"></div>' : ''}
                        <span class="text-xl mb-0.5">📥</span>
                        <span class="text-[9px] uppercase tracking-wider">Pending</span>
                    </button>
                    <button onclick="switchTab('approved')" class="flex flex-col items-center justify-center w-1/4 h-full ${currentTab === 'approved' ? 'text-dar-green font-bold' : 'text-gray-400'} relative">
                        ${currentTab === 'approved' ? '<div class="absolute top-0 w-1/2 h-1 dar-green rounded-b-full"></div>' : ''}
                        <span class="text-xl mb-0.5">✅</span>
                        <span class="text-[9px] uppercase tracking-wider">Approved</span>
                    </button>
                    <button onclick="switchTab('denied')" class="flex flex-col items-center justify-center w-1/4 h-full ${currentTab === 'denied' ? 'text-red-600 font-bold' : 'text-gray-400'} relative">
                        ${currentTab === 'denied' ? '<div class="absolute top-0 w-1/2 h-1 bg-red-600 rounded-b-full"></div>' : ''}
                        <span class="text-xl mb-0.5">❌</span>
                        <span class="text-[9px] uppercase tracking-wider">Denied</span>
                    </button>
                    <button onclick="switchTab('reports')" class="flex flex-col items-center justify-center w-1/4 h-full ${currentTab === 'reports' ? 'text-blue-600 font-bold' : 'text-gray-400'} relative">
                        ${currentTab === 'reports' ? '<div class="absolute top-0 w-1/2 h-1 bg-blue-600 rounded-b-full"></div>' : ''}
                        <span class="text-xl mb-0.5">📊</span>
                        <span class="text-[9px] uppercase tracking-wider">Reports</span>
                    </button>
                </nav>
                <div id="pwdModal" class="hidden absolute inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center px-4 modal-fade">
                    <div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl">
                        <div class="dar-green text-white p-4 font-bold text-center relative">
                            Change Password
                            <button onclick="hideChangePassword()" class="absolute right-4 top-4 text-white opacity-70 hover:opacity-100 text-xl leading-none">✕</button>
                        </div>
                        <div class="p-6 space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">CURRENT PASSWORD</label>
                                <input type="password" id="oldPwd" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">NEW PASSWORD</label>
                                <input type="password" id="newPwd" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-800">
                            </div>
                            <button onclick="updatePassword()" class="w-full mt-4 dar-green text-white font-bold py-3 rounded-xl active:opacity-80 transition shadow-md">
                                Save Changes
                            </button>
                        </div>
                    </div>
                </div>
            `;
            if (currentTab === 'pending') loadPendingTab();
            else if (currentTab === 'approved') loadStatusTab('APPROVED');
            else if (currentTab === 'denied') loadStatusTab('DISAPPROVED');
            else loadReportsTab();
        }

        function switchTab(tab) { currentTab = tab; renderMain(); }

        function showChangePassword() { document.getElementById('pwdModal').classList.remove('hidden'); }
        function hideChangePassword() { 
            document.getElementById('pwdModal').classList.add('hidden'); 
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
        }

        async function updatePassword() {
            const oldP = document.getElementById('oldPwd').value.trim();
            const newP = document.getElementById('newPwd').value.trim();
            if(!oldP || !newP) return alert("Please fill all fields.");
            try {
                const { data: userRecord, error } = await supabaseClient.from('users').select('password').eq('username', currentUser.username).single();
                if (error || !userRecord || userRecord.password !== oldP) return alert("Incorrect current password.");
                const { error: updError } = await supabaseClient.from('users').update({ password: newP }).eq('username', currentUser.username);
                if (updError) throw updError;
                alert("Password successfully updated!");
                hideChangePassword();
            } catch (err) { alert("Error updating password: " + err.message); }
        }

        async function loadPendingTab() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<div class="flex justify-center items-center h-full"><p class="text-gray-500 font-bold animate-pulse text-center">Syncing Inbox...</p></div>`;
            try {
                const [ordersRes, itinRes] = await Promise.all([
                    supabaseClient.from('travel_order').select('*'),
                    supabaseClient.from('itinerary').select('*')
                ]);
                const orders = ordersRes.data || [];
                const itineraries = itinRes.data || [];
                let groupedOrders = {};
                orders.forEach(o => {
                    if (!groupedOrders[o.to_no]) groupedOrders[o.to_no] = [];
                    groupedOrders[o.to_no].push(o);
                });
                pendingOrders = [];
                const uRole = currentUser.role;
                const uDivs = currentUser.divisions;
                const uUnit = currentUser.unit;
                for (const [to_no, group] of Object.entries(groupedOrders)) {
                    const first = group[0];
                    const unit = (first.unit || "").trim().toUpperCase();
                    const stat = (first.status || "").trim().toUpperCase();
                    const div = (first.division || "").trim().toUpperCase();
                    const transport = (first.transport || "").trim().toUpperCase();
                    let show = false;
                    if (uRole === "VEHICLE_APPROVER") {
                        if (stat === "PENDING_VEHICLE_RESERVATION" && transport === "GOV'T VEHICLE") show = true;
                    } else if (uRole === "UNIT_HEAD" || uRole === "MARPO") {
                        if (stat === "PENDING_UNIT_HEAD" && uDivs.includes(div) && unit === uUnit) show = true;
                    } else if (uRole === "CHIEF") {
                        if (stat === "PENDING_CHIEF" && uDivs.includes(div)) show = true;
                    } else if (uRole === "PARPO") {
                        if (stat === "PENDING_PARPO") show = true;
                    }
                    if (show) {
                        let dests = new Set();
                        let names = group.map(g => g.emp_name);
                        let itins = itineraries.filter(i => i.to_no === to_no);
                        itins.forEach(i => { if(i.destination) dests.add(i.destination); });
                        pendingOrders.push({ to_no, names, destinations: Array.from(dests).join(', ') || 'N/A', unit });
                    }
                }
                renderPendingUI();
            } catch (err) { content.innerHTML = `<div class="p-6 text-center text-red-500 font-bold">Error: ${err.message}</div>`; }
        }

        function renderPendingUI() {
            const content = document.getElementById('mainContent');
            if (pendingOrders.length === 0) {
                content.innerHTML = `<div class="flex flex-col justify-center items-center h-full px-6 text-center"><div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-3xl mb-4">✨</div><h2 class="text-xl font-bold text-gray-800">All caught up!</h2><p class="text-gray-500 text-sm mt-2">There are no pending requests.</p></div>`;
                return;
            }
            let html = `<div class="p-4 flex justify-between items-center sticky top-0 bg-gray-100/95 backdrop-blur z-20 border-b border-gray-200"><label class="flex items-center space-x-3 text-sm font-bold text-gray-700"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" class="w-5 h-5 rounded border-gray-300"><span>SELECT ALL (${pendingOrders.length})</span></label><button onclick="loadPendingTab()" class="text-gray-500 p-1">🔄</button></div><div class="p-4 space-y-4 pb-28">`;
            pendingOrders.forEach(o => {
                const displayName = o.names[0] + (o.names.length > 1 ? ` <span class="text-[10px] text-white bg-green-600 px-1.5 py-0.5 rounded-full">+${o.names.length-1}</span>` : '');
                html += `<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100"><label class="flex items-start space-x-4"><div class="pt-1"><input type="checkbox" value="${o.to_no}" class="to-checkbox w-6 h-6 rounded-md"></div><div class="flex-grow overflow-hidden"><span class="font-bold text-xs text-gray-400">${o.to_no}</span><p class="font-bold text-gray-800 text-left">${displayName}</p><p class="text-xs text-gray-600 truncate text-left">📍 ${o.destinations}</p></div></label><div class="flex justify-end space-x-2 mt-3 pt-3 border-t"><button onclick="processSingle('${o.to_no}', 'DISAPPROVE')" class="text-xs text-red-600 bg-red-50 px-4 py-2 rounded-lg font-bold">Deny</button><button onclick="processSingle('${o.to_no}', 'APPROVE')" class="text-xs text-white dar-green px-4 py-2 rounded-lg font-bold">Approve</button></div></div>`;
            });
            html += `</div><div class="fixed left-0 w-full bg-white/95 backdrop-blur border-t border-gray-200 p-3 flex justify-between space-x-3 z-40 batch-bar-position"><button onclick="handleBatchAction('DISAPPROVE')" class="w-1/3 bg-white text-gray-700 font-bold py-3 rounded-xl text-sm border border-gray-300">Batch Deny</button><button onclick="handleBatchAction('APPROVE')" class="w-2/3 dar-green text-white font-bold py-3 rounded-xl text-sm">Batch Approve</button></div>`;
            content.innerHTML = html;
        }

        function toggleSelectAll(source) { document.querySelectorAll('.to-checkbox').forEach(cb => cb.checked = source.checked); }

        async function processSingle(to_no, action) {
            let payload = action === 'DISAPPROVE' ? { status: "DISAPPROVED", received: prompt("Reason for denial:") } : getPayloadObject('APPROVE', currentUser);
            if(payload.received === null) return;
            await processUpdate([to_no], payload);
        }

        async function handleBatchAction(action) {
            const ids = Array.from(document.querySelectorAll('.to-checkbox:checked')).map(cb => cb.value);
            if (ids.length === 0) return alert("Select at least one.");
            let payload = action === 'DISAPPROVE' ? { status: "DISAPPROVED", received: prompt("Reason for denial:") } : getPayloadObject('APPROVE', currentUser);
            if(payload.received === null) return;
            if(confirm(`${action} ${ids.length} requests?`)) await processUpdate(ids, payload);
        }

        async function processUpdate(ids, payload) {
            for (let id of ids) await supabaseClient.from('travel_order').update(payload).eq('to_no', id);
            loadPendingTab();
        }

        function getPayloadObject(action, u) {
            if (u.role === "UNIT_HEAD" || u.role === "MARPO") return { status: "PENDING_CHIEF", unithead_signed: u.fullName };
            if (u.role === "CHIEF") return { status: "PENDING_PARPO", dc_signed: u.fullName };
            if (u.role === "PARPO") return { status: "APPROVED", parpo_signed: "RICARDO C. GARCIA" };
            return {};
        }

        async function loadStatusTab(status) {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<div class="flex justify-center items-center h-full text-center"><p class="text-gray-500 font-bold animate-pulse">Loading Records...</p></div>`;
            try {
                const { data: orders } = await supabaseClient.from('travel_order').select('*').eq('status', status);
                const { data: itin } = await supabaseClient.from('itinerary').select('*');
                let finalArray = orders.map(o => {
                    let itins = itin.filter(i => i.to_no === o.to_no);
                    return { to_no: o.to_no, name: o.emp_name, dest: itins.map(i => i.destination).join(', '), date: itins[0]?.travel_date || '' };
                });
                renderStatusUI(status, finalArray);
            } catch (e) { content.innerHTML = `<div class="p-6 text-center text-red-500">Error: ${e.message}</div>`; }
        }

        function renderStatusUI(status, data) {
            const content = document.getElementById('mainContent');
            const isAppr = status === 'APPROVED';
            let html = `<div class="p-4 sticky top-0 bg-gray-100/95 border-b flex justify-between items-center"><h2 class="font-bold text-sm text-gray-700 uppercase">RECENTLY ${status}</h2><button onclick="loadStatusTab('${status}')">🔄</button></div><div class="p-4 space-y-3 pb-8">`;
            data.forEach(r => {
                html += `<div class="bg-white p-4 rounded-2xl border ${isAppr ? 'border-gray-100' : 'border-red-100'} text-left"><div class="flex justify-between"><span class="text-[10px] font-bold ${isAppr ? 'text-green-600' : 'text-red-600'} uppercase">${status}</span><span class="text-xs font-bold text-gray-400">${r.to_no}</span></div><p class="font-bold text-gray-800">${r.name}</p><p class="text-xs text-gray-600 truncate">📍 ${r.dest || 'N/A'}</p><p class="text-xs font-semibold text-dar-green mt-1">📅 ${r.date || 'No Date'}</p></div>`;
            });
            content.innerHTML = html + `</div>`;
        }

        // --- 5. UPDATED REPORTS TAB (PSO, SO, HOLIDAY, TO) ---
        async function loadReportsTab() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `<div class="flex justify-center items-center h-full text-blue-500 font-bold animate-pulse">Generating Report...</div>`;
            try {
                // Fetching from your table list: travel_order, itinerary, pso_records, holidays
                const [toRes, itinRes, psoRes, holRes] = await Promise.all([
                    supabaseClient.from('travel_order').select('*').eq('status', 'APPROVED'),
                    supabaseClient.from('itinerary').select('*'),
                    supabaseClient.from('pso_records').select('*'), // Assuming status is handled if applicable
                    supabaseClient.from('holidays').select('*')
                ]);

                const uRole = currentUser.role;
                const uDivs = currentUser.divisions;
                const uUnit = currentUser.unit;

                let validTos = new Set();
                let toNames = {};
                toRes.data.forEach(o => {
                    let div = (o.division || "").toUpperCase();
                    let unit = (o.unit || "").toUpperCase();
                    if (uRole !== "PARPO" && uRole !== "VEHICLE_APPROVER") {
                        if (!uDivs.includes(div)) return;
                        if ((uRole === "UNIT_HEAD" || uRole === "MARPO") && unit !== uUnit) return;
                    }
                    validTos.add(o.to_no);
                    toNames[o.to_no] = o.emp_name;
                });

                reportData = [];

                // 1. Map Travel Orders (TO)
                itinRes.data.forEach(i => {
                    if (validTos.has(i.to_no) && i.travel_date) {
                        reportData.push({
                            id: i.to_no, type: 'TO', date: new Date(i.travel_date),
                            destination: i.destination || 'N/A', name: toNames[i.to_no], color: 'blue'
                        });
                    }
                });

                // 2. Map PSOs
                (psoRes.data || []).forEach(p => {
                    if (p.date) {
                        reportData.push({
                            id: p.pso_no || 'PSO', type: 'PSO', date: new Date(p.date),
                            destination: p.destination || 'Provincial', name: p.emp_name || 'N/A', color: 'purple'
                        });
                    }
                });

                // 3. Map Holidays
                (holRes.data || []).forEach(h => {
                    if (h.date) {
                        reportData.push({
                            id: 'HOL', type: 'HOLIDAY', date: new Date(h.date),
                            destination: 'N/A', name: h.name || 'Official Holiday', color: 'red'
                        });
                    }
                });

                renderReportsShell();
            } catch(e) { content.innerHTML = `<div class="p-6 text-center text-red-500 font-bold">Error: ${e.message}</div>`; }
        }

        function renderReportsShell() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="sticky top-0 bg-gray-100 z-20 pt-4 px-4 pb-2 border-b">
                    <h2 class="font-bold text-lg text-blue-800 mb-3 text-center">Activity Dashboard</h2>
                    <input type="text" id="reportSearch" placeholder="🔍 Search name or TO..." oninput="updateReportList()" class="w-full px-4 py-2.5 mb-3 rounded-xl border border-gray-300 text-sm">
                    <div class="flex bg-gray-200 rounded-xl p-1">
                        <button id="btn-day" onclick="setReportFilter('day')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'day' ? 'bg-white text-blue-700' : 'text-gray-500'}">Today</button>
                        <button id="btn-week" onclick="setReportFilter('week')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'week' ? 'bg-white text-blue-700' : 'text-gray-500'}">Week</button>
                        <button id="btn-month" onclick="setReportFilter('month')" class="w-1/3 py-1.5 text-xs font-bold rounded-lg ${reportFilter === 'month' ? 'bg-white text-blue-700' : 'text-gray-500'}">Month</button>
                    </div>
                </div>
                <div id="reportListContainer" class="p-4 space-y-3 pb-8"></div>
            `;
            updateReportList();
        }

        function setReportFilter(val) {
            reportFilter = val;
            renderReportsShell();
        }

        // --- UPDATED SORTING: MONTH VIEW IS OLDEST TO LATEST (1st onwards) ---
        function filterReportData(filterType) {
            const today = new Date();
            today.setHours(0,0,0,0);
            let filtered = reportData.filter(r => {
                const d = new Date(r.date); d.setHours(0,0,0,0);
                if (filterType === 'day') return d.getTime() === today.getTime();
                if (filterType === 'week') {
                    const sow = new Date(today); sow.setDate(today.getDate() - today.getDay());
                    const eow = new Date(sow); eow.setDate(sow.getDate() + 6);
                    return d >= sow && d <= eow;
                }
                if (filterType === 'month') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            });

            // Sorting logic change
            if (filterType === 'month') return filtered.sort((a, b) => a.date - b.date); // 1 ONWARDS
            return filtered.sort((a, b) => b.date - a.date); // Today/Week remains Latest to Oldest
        }

        function updateReportList() {
            const container = document.getElementById('reportListContainer');
            if(!container) return;
            const query = document.getElementById('reportSearch').value.toLowerCase();
            let data = filterReportData(reportFilter);
            if (query) data = data.filter(r => r.name.toLowerCase().includes(query) || r.id.toLowerCase().includes(query));
            if (data.length === 0) { container.innerHTML = `<div class="py-10 text-gray-400 font-bold text-center">No records found.</div>`; return; }

            let html = '';
            let lastDate = '';
            data.forEach(r => {
                const curDate = r.date.toDateString();
                if (curDate !== lastDate) {
                    lastDate = curDate;
                    const label = r.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    html += `<h3 class="text-[10px] font-black text-gray-400 mt-4 mb-2 uppercase tracking-widest border-b pb-1 text-left">${label}</h3>`;
                }
                
                const colors = { 
                    blue: 'border-blue-500 bg-blue-50 text-blue-800', 
                    purple: 'border-purple-500 bg-purple-50 text-purple-800', 
                    red: 'border-red-500 bg-red-50 text-red-800' 
                }[r.color];

                html += `
                    <div class="bg-white p-3 rounded-xl border-l-4 shadow-sm flex items-center justify-between mb-2 text-left ${colors.split(' ')[0]}">
                        <div class="overflow-hidden">
                            <p class="font-bold text-sm text-gray-800 truncate">${r.name}</p>
                            <p class="text-[10px] text-gray-500 truncate">📍 ${r.destination}</p>
                        </div>
                        <div class="shrink-0 ml-2">
                            <span class="text-[9px] font-black px-2 py-1 rounded-md uppercase ${colors.split(' ').slice(1).join(' ')}">${r.type}</span>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        window.onload = render;
    </script>
</body>
</html>
