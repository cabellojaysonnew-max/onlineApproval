<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAR CAM SUR 1 - ADMIN CONSOLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Custom Theme Colors mapped from your Python config */
        .bg-dar-green { background-color: #003811; }
        .bg-dar-light { background-color: #006400; }
        .text-dar-gold { color: #D4AF37; }
        .bg-dar-gold { background-color: #D4AF37; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #F3F4F6; }
    </style>
</head>
<body class="h-screen w-full text-gray-800 flex overflow-hidden">

    <div id="app" class="w-full h-full flex"></div>

    <script>
        // --- CLOUD CONFIG (SUPABASE) ---
        const SUPABASE_URL = "https://ytfpiyfapvybihlngxks.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZnBpeWZhcHZ5YmlobG5neGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMDA2MTIsImV4cCI6MjA4NTY3NjYxMn0.7TRVjvFjxVtxkP_hL3wnlxPT6FXJd0y7aKHNzDHThAQ";
        
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        // State Management
        let currentUser = null;
        let pendingOrders = [];

        // DOM Elements
        const appDiv = document.getElementById('app');

        // --- UI ROUTER ---
        function render() {
            if (!currentUser) {
                renderLogin();
            } else {
                renderDashboard();
            }
        }

        // --- LOGIN VIEW ---
        function renderLogin() {
            appDiv.innerHTML = `
                <div class="flex w-full h-full">
                    <div class="bg-dar-green w-1/3 flex flex-col justify-center items-center text-center px-8 shadow-xl z-10">
                        <p class="text-dar-gold font-semibold tracking-widest text-sm mb-4">REPUBLIC OF THE PHILIPPINES</p>
                        <h1 class="text-white text-3xl font-bold font-serif mb-1">DEPARTMENT OF</h1>
                        <h1 class="text-white text-3xl font-bold font-serif mb-6">AGRARIAN REFORM</h1>
                        <p class="text-slate-300 text-lg">Admin & Approval Console</p>
                    </div>

                    <div class="w-2/3 flex justify-center items-center bg-gray-100">
                        <div class="bg-white p-10 rounded shadow-lg w-96 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-dar-gold"></div>
                            <h2 class="text-2xl font-bold text-[#003811] mb-1">SECURE LOGIN</h2>
                            <p class="text-gray-500 text-sm mb-6">Enter credentials to access dashboard</p>
                            
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-gray-700 mb-1">Username</label>
                                <input type="text" id="username" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-[#003811]" autocomplete="off">
                            </div>
                            <div class="mb-6">
                                <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                                <input type="password" id="password" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-[#003811]">
                            </div>
                            
                            <p id="loginError" class="text-red-600 text-xs font-bold mb-4 hidden"></p>
                            
                            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-dar-green text-white font-bold py-3 rounded hover:bg-green-900 transition duration-200">
                                ACCESS DASHBOARD
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Add Enter key listener
            document.getElementById('password').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') handleLogin();
            });
        }

        async function handleLogin() {
            const userBox = document.getElementById('username').value.trim();
            const passBox = document.getElementById('password').value.trim();
            const errLbl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if(!userBox || !passBox) {
                errLbl.innerText = "Please enter both fields.";
                errLbl.classList.remove("hidden");
                return;
            }

            btn.innerText = "CONNECTING...";
            btn.disabled = true;

            try {
                const { data: users, error } = await supabaseClient.from('users').select('*');
                
                if (error) throw error;

                const user = users.find(u => u.username === userBox && u.password === passBox);

                if (user) {
                    currentUser = {
                        username: user.username,
                        fullName: user.full_name,
                        role: user.role.toUpperCase(),
                        divisions: user.division ? user.division.split(',').map(d => d.trim().toUpperCase()) : [],
                        unit: user.unit ? user.unit.trim().toUpperCase() : ''
                    };
                    render();
                } else {
                    errLbl.innerText = "Invalid Username or Password";
                    errLbl.classList.remove("hidden");
                }
            } catch (err) {
                errLbl.innerText = "Connection Error: " + err.message;
                errLbl.classList.remove("hidden");
            } finally {
                btn.innerText = "ACCESS DASHBOARD";
                btn.disabled = false;
            }
        }

        function logout() {
            currentUser = null;
            render();
        }

        // --- DASHBOARD VIEW ---
        function renderDashboard() {
            const displayDiv = currentUser.divisions.join(", ") || "N/A";
            
            appDiv.innerHTML = `
                <div class="bg-dar-green w-64 flex flex-col h-full text-white shadow-xl z-20">
                    <div class="py-8 text-center border-b border-green-800">
                        <h2 class="text-dar-gold font-bold text-xl font-serif">DAR CAM SUR 1</h2>
                        <p class="text-xs text-gray-300 tracking-wider mt-1">ADMINISTRATION</p>
                    </div>
                    
                    <div class="bg-[#052e16] p-4 mb-4">
                        <p class="font-bold text-sm truncate">${currentUser.fullName.toUpperCase()}</p>
                        <p class="text-xs text-dar-gold truncate">${currentUser.role} - ${displayDiv}</p>
                    </div>

                    <div class="flex-grow">
                        <button class="w-full text-left px-6 py-3 bg-dar-light text-dar-gold font-bold border-l-4 border-dar-gold flex items-center">
                            <span class="mr-3">📥</span> APPROVAL INBOX
                        </button>
                    </div>

                    <div class="mb-4">
                        <button onclick="logout()" class="w-full text-left px-6 py-3 text-red-400 hover:bg-red-900 hover:text-white transition text-sm font-bold flex items-center">
                            <span class="mr-3">🚪</span> LOG OUT
                        </button>
                    </div>
                </div>

                <div class="flex-grow bg-gray-100 flex flex-col h-full overflow-hidden">
                    <div class="p-8 pb-4">
                        <h1 class="text-3xl font-bold text-dar-green mb-6">Approval Inbox</h1>
                        
                        <div class="bg-white rounded shadow p-6 flex flex-col h-full">
                            <div class="flex justify-between items-center mb-4 border-b pb-4">
                                <div>
                                    <h3 class="font-semibold text-dar-green text-lg">PENDING REQUESTS</h3>
                                </div>
                                <div class="flex space-x-2">
                                    <button onclick="fetchApprovals()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 font-semibold text-sm transition">
                                        🔄 Refresh Data
                                    </button>
                                </div>
                            </div>
                            
                            <div class="overflow-auto flex-grow rounded border" style="max-height: calc(100vh - 250px);">
                                <table class="min-w-full text-left text-sm whitespace-nowrap">
                                    <thead class="bg-dar-green text-white sticky top-0 z-10">
                                        <tr>
                                            <th class="px-4 py-3 font-semibold">TO No</th>
                                            <th class="px-4 py-3 font-semibold">Employee</th>
                                            <th class="px-4 py-3 font-semibold">Unit</th>
                                            <th class="px-4 py-3 font-semibold">Status</th>
                                            <th class="px-4 py-3 font-semibold">Transport</th>
                                        </tr>
                                    </thead>
                                    <tbody id="approvalTableBody" class="divide-y divide-gray-200 bg-white">
                                        <tr><td colspan="5" class="text-center py-4 text-gray-500 italic">Loading requests...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            fetchApprovals();
        }

        // --- DATA FETCHING ---
        async function fetchApprovals() {
            const tbody = document.getElementById('approvalTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500 font-semibold">Fetching records from database...</td></tr>`;

            try {
                // Fetch basic TOs
                const { data: orders, error } = await supabaseClient.from('travel_orders').select('*');
                if (error) throw error;

                const myRole = currentUser.role;
                const myDivs = currentUser.divisions;
                const myUnit = currentUser.unit;

                // Replicate Tkinter filtering logic
                let filteredOrders = [];

                orders.forEach(o => {
                    const unit = (o.unit || "").trim().toUpperCase();
                    const stat = (o.status || "").trim().toUpperCase();
                    const div = (o.division || "").trim().toUpperCase();
                    const transport = (o.transport || "").trim().toUpperCase();
                    
                    let show = false;
                    if (myRole === "VEHICLE_APPROVER") {
                        if (stat === "PENDING_VEHICLE_RESERVATION" && transport === "GOV'T VEHICLE") show = true;
                    } else if (myRole === "UNIT_HEAD" || myRole === "MARPO") {
                        if (stat === "PENDING_UNIT_HEAD" && myDivs.includes(div) && unit === myUnit) show = true;
                    } else if (myRole === "CHIEF") {
                        if (stat === "PENDING_CHIEF" && myDivs.includes(div)) show = true;
                    } else if (myRole === "PARPO") {
                        if (stat === "PENDING_PARPO") show = true;
                    }

                    if (show) {
                        filteredOrders.push(o);
                    }
                });

                if (filteredOrders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500 italic">No pending requests for your role.</td></tr>`;
                    return;
                }

                // Render Table
                let html = '';
                filteredOrders.forEach((o, index) => {
                    const bgClass = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                    html += `
                        <tr class="${bgClass} hover:bg-green-50 transition cursor-pointer">
                            <td class="px-4 py-3 font-semibold text-gray-800">${o.to_no || 'N/A'}</td>
                            <td class="px-4 py-3">${o.emp_name || 'Unknown'}</td>
                            <td class="px-4 py-3 text-gray-600">${o.unit || 'N/A'}</td>
                            <td class="px-4 py-3">
                                <span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs font-bold rounded">${o.status}</span>
                            </td>
                            <td class="px-4 py-3 text-gray-600">${o.transport || 'N/A'}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-red-500 font-bold">Error loading data: ${err.message}</td></tr>`;
            }
        }

        // Initialize App
        window.onload = render;

    </script>
</body>
</html>
